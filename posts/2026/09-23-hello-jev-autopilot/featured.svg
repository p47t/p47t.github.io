<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b1120;stop-opacity:1" />
    </linearGradient>

    <!-- Radar Grid Gradient -->
    <radialGradient id="radarGlow" cx="420" cy="337" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#065f46;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0" />
    </radialGradient>

    <!-- Panel Card Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.92" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowMint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Radar Conic / Circular Scan Grid -->
  <g transform="translate(420, 337)">
    <circle r="360" fill="url(#radarGlow)" />
    <circle r="320" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.35" />
    <circle r="240" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.45" />
    <circle r="160" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="2,4" opacity="0.4" />
    <circle r="80"  fill="none" stroke="#10b981" stroke-width="1" opacity="0.3" />

    <!-- Crosshair axes -->
    <line x1="-360" y1="0" x2="360" y2="0" stroke="#334155" stroke-width="1" opacity="0.3" />
    <line x1="0" y1="-360" x2="0" y2="360" stroke="#334155" stroke-width="1" opacity="0.3" />
    <line x1="-254" y1="-254" x2="254" y2="254" stroke="#334155" stroke-width="1" stroke-dasharray="2,6" opacity="0.2" />
    <line x1="-254" y1="254" x2="254" y2="-254" stroke="#334155" stroke-width="1" stroke-dasharray="2,6" opacity="0.2" />

    <!-- Radar Sweep Arc -->
    <path d="M 0 0 L 226 -226 A 320 320 0 0 1 320 0 Z" fill="#10b981" opacity="0.04" />
  </g>

  <!-- Background Subtle Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Asteroids Field (Game Elements) -->
  <g id="asteroids" transform="translate(0, 0)">
    <!-- Asteroid 1 (Large, target) -->
    <g transform="translate(560, 200)" filter="url(#cardShadow)">
      <!-- Targeting Bracket -->
      <path d="M -52 -36 L -52 -52 L -36 -52" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M 36 -52 L 52 -52 L 52 -36" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M -52 36 L -52 52 L -36 52" fill="none" stroke="#38bdf8" stroke-width="2" />
      <path d="M 36 52 L 52 52 L 52 36" fill="none" stroke="#38bdf8" stroke-width="2" />
      
      <!-- Rock Polygon -->
      <polygon points="0,-48 28,-36 46,-12 40,24 16,44 -20,42 -44,20 -46,-18 -26,-40" 
               fill="#1e293b" stroke="#eab788" stroke-width="2.5" />
      <text x="0" y="4" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">ID: r04</text>
      <text x="64" y="-28" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">LOCKED TARGET</text>
      <text x="64" y="-12" fill="#64748b" font-family="monospace" font-size="10">closing: +142 px/s</text>
      <text x="64" y="2" fill="#64748b" font-family="monospace" font-size="10">approach: 0.9s</text>
    </g>

    <!-- Asteroid 2 (Medium, threatening) -->
    <g transform="translate(230, 440)">
      <polygon points="0,-28 20,-20 28,-4 22,18 4,28 -18,24 -28,8 -24,-16" 
               fill="#1e293b" stroke="#d97706" stroke-width="2" />
      <!-- Velocity vector -->
      <line x1="0" y1="0" x2="38" y2="-28" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3" />
      <polygon points="38,-28 32,-30 35,-23" fill="#f59e0b" />
    </g>

    <!-- Asteroid 3 (Small) -->
    <g transform="translate(180, 190)">
      <polygon points="0,-16 12,-10 16,2 10,14 -4,16 -14,6 -12,-10" 
               fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
    </g>

    <!-- Asteroid 4 (Medium, far right) -->
    <g transform="translate(680, 470)">
      <polygon points="0,-32 24,-22 32,-2 26,22 6,32 -20,26 -30,6 -26,-18" 
               fill="#1e293b" stroke="#94a3b8" stroke-width="2" opacity="0.7" />
    </g>
  </g>

  <!-- Spaceship with Lead Prediction and Thruster Flame -->
  <g id="ship" transform="translate(370, 360)">
    <!-- Predictive Firing Vector (Lead Calculation) -->
    <line x1="0" y1="0" x2="190" y2="-160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8" />
    <circle cx="190" cy="-160" r="4" fill="#38bdf8" filter="url(#glowCyan)" />

    <!-- Bullet stream -->
    <circle cx="65" cy="-55" r="2.5" fill="#34d399" filter="url(#glowMint)" />
    <circle cx="130" cy="-110" r="2.5" fill="#34d399" filter="url(#glowMint)" />

    <!-- Thruster Flame -->
    <polygon points="-10,14 0,28 10,14 4,16 -4,16" fill="url(#amberGrad)" opacity="0.9" />

    <!-- Ship Triangle Body (Pointing towards upper-right) -->
    <g transform="rotate(40)">
      <!-- Spawn Shield (subtle) -->
      <circle r="26" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
      <!-- Ship Hull -->
      <polygon points="0,-20 14,14 0,9 -14,14" fill="#0f172a" stroke="#a5ffdb" stroke-width="2.5" filter="url(#glowMint)" />
    </g>
  </g>

  <!-- Flight Computer Telemetry UI Overlay (Right Side) -->
  <g transform="translate(800, 75)" filter="url(#cardShadow)">
    <!-- Main Card Body -->
    <rect width="340" height="525" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1" />

    <!-- Header -->
    <g transform="translate(24, 24)">
      <!-- Jev Badge -->
      <rect width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
      <text x="18" y="24" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-weight="900" font-size="18">j.</text>

      <text x="48" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Flight Computer</text>
      <text x="48" y="32" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">POWERED BY JEV</text>

      <!-- Live Dot -->
      <circle cx="282" cy="18" r="4" fill="#34d399" filter="url(#glowMint)" />
    </g>

    <!-- Pilot Mode Indicator -->
    <g transform="translate(24, 82)">
      <rect width="292" height="34" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect x="146" y="2" width="144" height="30" rx="5" fill="#1e293b" />
      <text x="73" y="21" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Manual (Human)</text>
      <text x="218" y="21" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">✳ Jev Autopilot</text>
    </g>

    <!-- Tactical Decision Card -->
    <g transform="translate(24, 134)">
      <rect width="292" height="96" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CURRENT MANEUVER</text>
      <text x="16" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Intercept</text>
      <text x="260" y="54" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20">↗</text>
      
      <line x1="16" y1="68" x2="276" y2="68" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="85" fill="#94a3b8" font-family="monospace" font-size="11">TARGET: <tspan fill="#f1f5f9" font-weight="bold">R04</tspan></text>
      <text x="190" y="85" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">120 HZ ACTUATION</text>
    </g>

    <!-- Maneuver Probabilities Breakdown -->
    <g transform="translate(24, 248)">
      <text x="0" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">TACTICAL PROBABILITIES</text>
      <text x="292" y="14" text-anchor="end" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">SYSTEM 1</text>

      <!-- Intercept Row (Winner) -->
      <g transform="translate(0, 26)">
        <text x="0" y="12" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Intercept</text>
        <text x="292" y="12" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">82%</text>
        <rect y="18" width="292" height="6" rx="3" fill="#1e293b" />
        <rect y="18" width="240" height="6" rx="3" fill="url(#cyanGrad)" />
      </g>

      <!-- Evade Row -->
      <g transform="translate(0, 60)">
        <text x="0" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Evade</text>
        <text x="292" y="12" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="12">11%</text>
        <rect y="18" width="292" height="6" rx="3" fill="#1e293b" />
        <rect y="18" width="32" height="6" rx="3" fill="#475569" />
      </g>

      <!-- Reposition Row -->
      <g transform="translate(0, 94)">
        <text x="0" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Reposition</text>
        <text x="292" y="12" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="12">7%</text>
        <rect y="18" width="292" height="6" rx="3" fill="#1e293b" />
        <rect y="18" width="20" height="6" rx="3" fill="#475569" />
      </g>
    </g>

    <!-- Telemetry Metrics (Confidence & Latency) -->
    <g transform="translate(24, 388)">
      <!-- Confidence Box -->
      <rect width="138" height="58" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">CONFIDENCE</text>
      <text x="14" y="44" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="800">82%</text>

      <!-- Latency Box -->
      <g transform="translate(154, 0)">
        <rect width="138" height="58" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1" />
        <text x="14" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">API LATENCY</text>
        <text x="14" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">64 ms</text>
      </g>
    </g>

    <!-- Bottom Footnote -->
    <g transform="translate(24, 468)">
      <rect width="292" height="38" rx="6" fill="#080c14" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="23" fill="#94a3b8" font-family="monospace" font-size="10">REFLEX: <tspan fill="#34d399">STANDBY</tspan> · TTL: <tspan fill="#38bdf8">4.5s</tspan></text>
    </g>
  </g>

  <!-- Left Header & Title Branding -->
  <g transform="translate(60, 75)">
    <!-- Tagline & Project Chip -->
    <rect width="168" height="26" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
    <text x="12" y="17" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">TYPESAFE AI × JEV</text>

    <!-- Main Title -->
    <text x="0" y="68" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      ASTEROIDS AUTOPILOT
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="400">
      Dual-Layer Architecture: Real-time Physics &amp; System 1 Tactics
    </text>
  </g>

  <!-- Bottom Left Tech Badges -->
  <g transform="translate(60, 580)">
    <g transform="translate(0, 0)">
      <rect width="124" height="28" rx="4" fill="#1e293b" opacity="0.8" />
      <text x="62" y="18" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="600">TypeScript</text>
    </g>
    <g transform="translate(134, 0)">
      <rect width="144" height="28" rx="4" fill="#1e293b" opacity="0.8" />
      <text x="72" y="18" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="600">120 Hz Physics</text>
    </g>
    <g transform="translate(288, 0)">
      <rect width="140" height="28" rx="4" fill="#1e293b" opacity="0.8" />
      <text x="70" y="18" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="600">Lead Shooting</text>
    </g>
    <g transform="translate(438, 0)">
      <rect width="148" height="28" rx="4" fill="#1e293b" opacity="0.8" />
      <text x="74" y="18" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">Reflex Override</text>
    </g>
  </g>
</svg>
