<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eab308;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.8" />
    </linearGradient>

    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="250" cy="200" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="450" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Left Side: 2D Photo Input Card -->
  <g transform="translate(100, 180)" filter="url(#dropShadow)">
    <!-- Photo Frame -->
    <rect width="240" height="280" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="15" y="15" width="210" height="210" rx="8" fill="#0f172a"/>
    <!-- Photo Graphic (Mountain/Portrait Depiction) -->
    <path d="M 30 190 L 80 120 L 120 160 L 170 90 L 210 190 Z" fill="url(#cyanGrad)" opacity="0.8"/>
    <circle cx="70" cy="65" r="18" fill="#eab308" opacity="0.9"/>
    <text x="120" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">2D Input Photo</text>
  </g>

  <!-- Arrow Transition: AI Depth Estimation & Triangulation -->
  <g transform="translate(375, 300)" filter="url(#glow)">
    <path d="M 0 20 L 50 20 L 50 0 L 90 30 L 50 60 L 50 40 L 0 40 Z" fill="url(#orangeGrad)"/>
    <text x="45" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f97316" text-anchor="middle">MiDaS / StereoBM</text>
  </g>

  <!-- Right Side: 3D Relief Mesh Visualization (Isometric Projection) -->
  <g transform="translate(740, 200)" filter="url(#dropShadow)">
    <!-- Solid Base Block (Isometric) -->
    <path d="M 0 140 L 180 50 L 360 140 L 180 230 Z" fill="url(#baseGrad)" stroke="#475569" stroke-width="2"/>
    <path d="M 0 140 L 0 170 L 180 260 L 180 230 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M 360 140 L 360 170 L 180 260 L 180 230 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Elevated 3D Heightfield Mesh Layer -->
    <!-- Grid Wireframe Triangles with Depth Elevations -->
    <g fill="none" stroke="url(#meshGrad)" stroke-width="2.5" stroke-linejoin="round">
      <!-- Outer Rim Elevating Up -->
      <path d="M 0 120 L 60 70 L 120 90 L 180 30 L 240 70 L 300 40 L 360 120 L 300 160 L 240 140 L 180 200 L 120 160 L 60 180 Z"/>
      <!-- Inner Grid Lines forming 3D Bas-Relief Surface -->
      <path d="M 60 70 L 120 130 L 180 90 L 240 140"/>
      <path d="M 120 90 L 180 150 L 240 90 L 300 160"/>
      <path d="M 60 180 L 120 130 L 180 200"/>
      <path d="M 180 30 L 180 90 L 180 150"/>
      <path d="M 120 90 L 180 90 M 180 90 L 240 90"/>
      <!-- Peak Heights -->
      <path d="M 180 30 L 120 90 M 180 30 L 240 70"/>
    </g>

    <!-- Mesh Nodes/Vertices Glow -->
    <circle cx="180" cy="30" r="5" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="120" cy="90" r="4" fill="#8b5cf6"/>
    <circle cx="240" cy="70" r="4" fill="#8b5cf6"/>
    <circle cx="180" cy="90" r="5" fill="#3b82f6"/>
    <circle cx="180" cy="150" r="4" fill="#06b6d4"/>

    <!-- STL Output Badge -->
    <g transform="translate(180, 290)">
      <rect x="-80" y="-18" width="160" height="36" rx="18" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">WATERTIGHT STL</text>
    </g>
  </g>

  <!-- Title Banner / Header Text -->
  <g transform="translate(600, 80)" text-anchor="middle">
    <!-- Series Tag -->
    <rect x="-90" y="-35" width="180" height="28" rx="14" fill="#3b82f6" opacity="0.2"/>
    <text x="0" y="-16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1.5">RUST 52 PROJECTS</text>

    <!-- Main Title -->
    <text x="0" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">3D Depth Relief Generator</text>
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">用 Rust + OpenCV 把 2D 照片轉換為可 3D 列印的實體浮雕</text>
  </g>

  <!-- Footer Tags -->
  <g transform="translate(600, 630)" text-anchor="middle" font-family="Source Code Pro, monospace" font-size="13" fill="#64748b">
    <text x="0" y="0">Rust • OpenCV 5 • MiDaS ONNX • StereoBM • Triangulation • Binary STL</text>
  </g>
</svg>
