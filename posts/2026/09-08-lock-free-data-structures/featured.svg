<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Lock-free 資料結構實戰</title>
  <desc id="desc">從 CAS 狀態轉移、Treiber Stack 到 ABA 與安全記憶體回收機制</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="50" y="48" width="140" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, 'Microsoft JhengHei', sans-serif">
    <text x="50" y="115" font-size="44" font-weight="700" fill="#c0caf5">Lock-free 資料結構實戰</text>
    <text x="52" y="160" font-size="22" fill="#7dcfff">CAS State Transitions · Treiber Stack · Safe Memory Reclamation</text>

    <!-- Three Pillars Cards -->
    <g fill="#1f2335" stroke="#414868" stroke-width="1.5">
      <rect x="50" y="200" width="340" height="150" rx="12"/>
      <rect x="430" y="200" width="340" height="150" rx="12"/>
      <rect x="810" y="200" width="340" height="150" rx="12"/>
    </g>

    <!-- Pillar 1: Atomic CAS -->
    <g font-size="22" text-anchor="middle">
      <text x="220" y="245" fill="#7dcfff" font-weight="600">01 · CAS 狀態移轉</text>
      <text x="220" y="285" font-size="16" fill="#c0caf5">compare_exchange_weak</text>
      <text x="220" y="315" font-size="14" fill="#a9b1d6">成功發布新頂端 · 失敗重試</text>
    </g>

    <!-- Pillar 2: ABA Problem -->
    <g font-size="22" text-anchor="middle">
      <text x="600" y="245" fill="#bb9af7" font-weight="600">02 · ABA 拓撲幽靈</text>
      <text x="600" y="285" font-size="16" fill="#c0caf5">位址相同 ≠ 狀態未變</text>
      <text x="600" y="315" font-size="14" fill="#a9b1d6">指標重用引發 Use-After-Free</text>
    </g>

    <!-- Pillar 3: Safe Reclamation -->
    <g font-size="22" text-anchor="middle">
      <text x="980" y="245" fill="#9ece6a" font-weight="600">03 · 安全記憶體回收</text>
      <text x="980" y="285" font-size="16" fill="#c0caf5">HP · EBR · RCU</text>
      <text x="980" y="315" font-size="14" fill="#a9b1d6">確認舊讀者離場方可釋放</text>
    </g>
  </g>

  <!-- Central Treiber Stack Visual -->
  <g transform="translate(0, 390)">
    <rect x="50" y="0" width="1100" height="180" rx="12" fill="#1a1b26" stroke="#24283b" stroke-width="2"/>
    <text x="80" y="40" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#7aa2f7">Treiber Stack 拓撲示意</text>

    <!-- Stack Nodes -->
    <g font-family="Consolas, monospace" font-size="22" text-anchor="middle" fill="#c0caf5">
      <!-- Head Pointer -->
      <g transform="translate(160, 95)">
        <rect x="-60" y="-30" width="120" height="60" rx="8" fill="#24283b" stroke="#7dcfff" stroke-width="2"/>
        <text y="8" fill="#7dcfff" font-weight="700">head</text>
      </g>

      <!-- Node A -->
      <g transform="translate(420, 95)">
        <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#1f2335" stroke="#414868" stroke-width="2"/>
        <text y="8">Node A</text>
      </g>

      <!-- Node B -->
      <g transform="translate(680, 95)">
        <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#1f2335" stroke="#414868" stroke-width="2"/>
        <text y="8">Node B</text>
      </g>

      <!-- Node C / Null -->
      <g transform="translate(940, 95)">
        <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#1f2335" stroke="#414868" stroke-width="2"/>
        <text y="8">Node C</text>
      </g>
    </g>

    <!-- Connective Arrows -->
    <path d="M225 95 H340" stroke="#7dcfff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M495 95 H600" stroke="#7dcfff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M755 95 H860" stroke="#7dcfff" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1015 95 H1080" stroke="#565f89" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(50, 615)" font-family="Consolas, monospace" font-size="14">
    <rect width="60" height="26" rx="4" fill="#24283b" stroke="#7dcfff"/>
    <text x="30" y="18" fill="#7dcfff" text-anchor="middle">C++</text>
    <rect x="75" width="65" height="26" rx="4" fill="#24283b" stroke="#ff9e64"/>
    <text x="107" y="18" fill="#ff9e64" text-anchor="middle">Rust</text>
    <rect x="155" width="160" height="26" rx="4" fill="#24283b" stroke="#bb9af7"/>
    <text x="235" y="18" fill="#bb9af7" text-anchor="middle">Hazard Pointer</text>
    <rect x="330" width="70" height="26" rx="4" fill="#24283b" stroke="#9ece6a"/>
    <text x="365" y="18" fill="#9ece6a" text-anchor="middle">EBR</text>
    <rect x="415" width="70" height="26" rx="4" fill="#24283b" stroke="#7aa2f7"/>
    <text x="450" y="18" fill="#7aa2f7" text-anchor="middle">RCU</text>
  </g>
  <text x="1150" y="630" font-family="Segoe UI, sans-serif" font-size="15" fill="#565f89" text-anchor="end">blog.simplypatrick.com</text>
</svg>
