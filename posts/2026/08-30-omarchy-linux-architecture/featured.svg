<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a10;stop-opacity:1" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f293d;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:0.95" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675" />
  </g>

  <!-- Title & Badges Area -->
  <g transform="translate(80, 55)">
    <!-- Badges -->
    <g>
      <rect x="0" y="0" width="135" height="28" rx="14" fill="#9ece6a" fill-opacity="0.2" stroke="#9ece6a" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="67" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#9ece6a" text-anchor="middle" letter-spacing="0.5">KEYBOARD-DRIVEN</text>

      <rect x="145" y="0" width="125" height="28" rx="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="207" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">TILE-PREFERRED</text>

      <rect x="280" y="0" width="105" height="28" rx="14" fill="#bb9af7" fill-opacity="0.2" stroke="#bb9af7" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="332" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#bb9af7" text-anchor="middle" letter-spacing="0.5">AI-NATIVE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Omarchy Linux 架構剖析與實戰
    </text>

    <!-- Subtitle -->
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Keyboard-Driven · Tile-Preferred · AI-Native 現代化桌面體系
    </text>
  </g>

  <!-- 3 Pillar Hero Cards -->
  <g transform="translate(80, 195)">
    <!-- Pillar 1: Keyboard Driven -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="330" height="420" rx="14" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="20" y="24" width="44" height="44" rx="10" fill="#22c55e" fill-opacity="0.2" />
      <text x="42" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#4ade80" text-anchor="middle">⌨️</text>
      
      <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Keyboard-Driven</text>
      <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#4ade80">全鍵盤驅動與極速操作</text>

      <text x="20" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">
        <tspan x="20" dy="0">• 直覺的 Super / Alt 快捷鍵網</tspan>
        <tspan x="20" dy="28">• 整合語音聽寫 (Voxtype 錄音)</tspan>
        <tspan x="20" dy="28">• 宣告式 Lua 快捷鍵自訂 API</tspan>
        <tspan x="20" dy="28">• 支援客製 Meh Key 擴充流</tspan>
        <tspan x="20" dy="28">• 鍵盤即時搜尋選單與啟動器</tspan>
      </text>
    </g>

    <!-- Pillar 2: Tile Preferred -->
    <g transform="translate(355, 0)" filter="url(#shadow)">
      <rect width="330" height="420" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="20" y="24" width="44" height="44" rx="10" fill="#0284c7" fill-opacity="0.2" />
      <text x="42" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#38bdf8" text-anchor="middle">🪟</text>
      
      <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Tile-Preferred</text>
      <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#38bdf8">平鋪視窗導向與空間利用</text>

      <text x="20" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">
        <tspan x="20" dy="0">• Hyprland 智慧動態平鋪佈局</tspan>
        <tspan x="20" dy="28">• 零重疊、零浪費螢幕空間</tspan>
        <tspan x="20" dy="28">• UWSM Systemd 工作階段隔離</tspan>
        <tspan x="20" dy="28">• 多螢幕與 1-9 工作區迅速調度</tspan>
        <tspan x="20" dy="28">• 模組化視窗規則 (windows.lua)</tspan>
      </text>
    </g>

    <!-- Pillar 3: AI Native -->
    <g transform="translate(710, 0)" filter="url(#shadow)">
      <rect width="330" height="420" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="20" y="24" width="44" height="44" rx="10" fill="#7c3aed" fill-opacity="0.2" />
      <text x="42" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#c084fc" text-anchor="middle">🤖</text>
      
      <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">AI-Native</text>
      <text x="20" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#c084fc">AI 原生架構與 Agent 協同</text>

      <text x="20" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">
        <tspan x="20" dy="0">• 內建專屬 Agent Skills 知識庫</tspan>
        <tspan x="20" dy="28">• 結構化自省 (omarchy --json)</tspan>
        <tspan x="20" dy="28">• 狀態列即時 AI Token/額度追蹤</tspan>
        <tspan x="20" dy="28">• 安全插件克隆與快速復原機制</tspan>
        <tspan x="20" dy="28">• 免互動 Sudo 阻塞與智慧除錯</tspan>
      </text>
    </g>
  </g>
</svg>
