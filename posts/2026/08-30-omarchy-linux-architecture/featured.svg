<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090d16;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675" />
  </g>

  <!-- Top Badges & Architecture Header (No repeated title/subtitle) -->
  <g transform="translate(80, 48)">
    <g transform="translate(0, 0)">
      <rect width="150" height="28" rx="14" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="75" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="0.5">KEYBOARD-DRIVEN</text>
    </g>
    <g transform="translate(165, 0)">
      <rect width="145" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="72" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">TILE-PREFERRED</text>
    </g>
    <g transform="translate(325, 0)">
      <rect width="115" height="28" rx="14" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="57" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">AI-NATIVE</text>
    </g>
    <g transform="translate(455, 0)">
      <rect width="165" height="28" rx="14" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="82" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="0.5">HYPRLAND &amp; ARCH</text>
    </g>
    <text x="1040" y="20" font-family="'Source Code Pro', Consolas, monospace" font-size="13" fill="#64748b" text-anchor="end">MODERN DESKTOP ARCHITECTURE</text>
  </g>

  <!-- 3 Pillar Hero Cards -->
  <g transform="translate(80, 110)">
    <!-- Pillar 1: Keyboard Driven -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="330" height="495" rx="14" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="20" y="24" width="48" height="48" rx="12" fill="#22c55e" fill-opacity="0.2" />
      <text x="44" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#4ade80" text-anchor="middle">⌨️</text>
      
      <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Keyboard-Driven</text>
      <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#4ade80">全鍵盤驅動與極速操作</text>

      <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13.5" font-weight="400" fill="#cbd5e1">
        <tspan x="20" dy="0">• 直覺的 Super / Alt 快捷鍵網</tspan>
        <tspan x="20" dy="32">• 整合語音聽寫 (Voxtype 錄音)</tspan>
        <tspan x="20" dy="32">• 宣告式 Lua 快捷鍵自訂 API</tspan>
        <tspan x="20" dy="32">• 支援客製 Meh Key 擴充流</tspan>
        <tspan x="20" dy="32">• 鍵盤即時搜尋選單與啟動器</tspan>
        <tspan x="20" dy="32">• 極速無滑鼠工作流切換</tspan>
      </text>

      <rect x="20" y="435" width="290" height="34" rx="6" fill="#22c55e" fill-opacity="0.1" />
      <text x="165" y="457" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">bind = $mainMod, Return, exec, alacritty</text>
    </g>

    <!-- Pillar 2: Tile Preferred -->
    <g transform="translate(355, 0)" filter="url(#shadow)">
      <rect width="330" height="495" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="20" y="24" width="48" height="48" rx="12" fill="#0284c7" fill-opacity="0.2" />
      <text x="44" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#38bdf8" text-anchor="middle">🪟</text>
      
      <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Tile-Preferred</text>
      <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#38bdf8">平鋪視窗導向與空間利用</text>

      <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13.5" font-weight="400" fill="#cbd5e1">
        <tspan x="20" dy="0">• Hyprland 智慧動態平鋪佈局</tspan>
        <tspan x="20" dy="32">• 零重疊視窗與雙螢幕自動分配</tspan>
        <tspan x="20" dy="32">• 規則化浮動 (PIP、對話框黑名單)</tspan>
        <tspan x="20" dy="32">• 快速分屏、聚焦與位置互換</tspan>
        <tspan x="20" dy="32">• Wayland 原生硬體加速渲染</tspan>
        <tspan x="20" dy="32">• 專注全螢幕與虛擬工作區</tspan>
      </text>

      <rect x="20" y="435" width="290" height="34" rx="6" fill="#38bdf8" fill-opacity="0.1" />
      <text x="165" y="457" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle">general { gaps_in = 4, gaps_out = 8 }</text>
    </g>

    <!-- Pillar 3: AI Native -->
    <g transform="translate(710, 0)" filter="url(#shadow)">
      <rect width="330" height="495" rx="14" fill="url(#cardGrad)" stroke="#bb9af7" stroke-width="1.5" stroke-opacity="0.7"/>
      <rect x="20" y="24" width="48" height="48" rx="12" fill="#7c3aed" fill-opacity="0.2" />
      <text x="44" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#bb9af7" text-anchor="middle">🤖</text>
      
      <text x="20" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#ffffff">AI-Native</text>
      <text x="20" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="14" font-weight="600" fill="#bb9af7">AI 代理深度整合與自動化</text>

      <text x="20" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="13.5" font-weight="400" fill="#cbd5e1">
        <tspan x="20" dy="0">• herdr 統一代理多重任務調度</tspan>
        <tspan x="20" dy="32">• 整合 Claude Code 與終端編程</tspan>
        <tspan x="20" dy="32">• 截圖與選區即時送交多模態模型</tspan>
        <tspan x="20" dy="32">• 系統設定檔 AI 輔助自動維護</tspan>
        <tspan x="20" dy="32">• 語意化快速鍵產生與除錯</tspan>
        <tspan x="20" dy="32">• 本地與雲端大語言模型無縫切換</tspan>
      </text>

      <rect x="20" y="435" width="290" height="34" rx="6" fill="#bb9af7" fill-opacity="0.1" />
      <text x="165" y="457" font-family="monospace" font-size="12" fill="#bb9af7" text-anchor="middle">herdr spawn --profile coding-agent</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <text x="1120" y="635" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">blog.simplypatrick.com</text>
</svg>
