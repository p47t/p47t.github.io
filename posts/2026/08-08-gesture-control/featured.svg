<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a12;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="200" cy="200" r="220" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Header Banner Title -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="1">Temporal Multi-Hand Tracking &amp; Hysteresis AI</text>
    <text y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">Greedy Matching • Hysteresis Voting (-30..+30) • Layer 2 Handedness Evaluation</text>
  </g>

  <!-- Left Card: AI Neural Pipeline & Dual Handedness -->
  <g transform="translate(90, 160)" filter="url(#dropShadow)">
    <rect width="400" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="20" y="20" width="360" height="240" rx="10" fill="#090d16" stroke="#1e293b"/>

    <!-- Left Hand Skeleton (Magenta) -->
    <g stroke="#ec4899" stroke-width="2" opacity="0.9">
      <line x1="120" y1="210" x2="90" y2="175"/>
      <line x1="120" y1="210" x2="110" y2="155"/>
      <line x1="120" y1="210" x2="130" y2="160"/>
      <line x1="110" y1="155" x2="105" y2="105"/>
      <line x1="130" y1="160" x2="135" y2="115"/>
    </g>

    <!-- Right Hand Skeleton (Cyan) -->
    <g stroke="#06b6d4" stroke-width="2.5" opacity="0.9">
      <line x1="260" y1="220" x2="220" y2="180"/>
      <line x1="260" y1="220" x2="245" y2="160"/>
      <line x1="260" y1="220" x2="275" y2="165"/>
      <line x1="260" y1="220" x2="305" y2="180"/>
      <line x1="245" y1="160" x2="235" y2="120"/>
      <line x1="275" y1="165" x2="270" y2="115"/>
      <line x1="305" y1="180" x2="310" y2="130"/>
    </g>

    <!-- Joint Nodes -->
    <circle cx="105" cy="105" r="4" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="135" cy="115" r="4" fill="#ec4899" filter="url(#glow)"/>
    <circle cx="235" cy="120" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="270" cy="115" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="310" cy="130" r="4" fill="#06b6d4" filter="url(#glow)"/>

    <!-- Model Badges -->
    <rect x="30" y="30" width="135" height="24" rx="4" fill="#ec4899" opacity="0.9"/>
    <text x="97" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Left Hand (Magenta)</text>

    <rect x="235" y="30" width="135" height="24" rx="4" fill="#0284c7" opacity="0.9"/>
    <text x="302" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Right Hand (Cyan)</text>

    <!-- Description -->
    <text x="200" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Layer 2 Handedness &amp; NMS</text>
    <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">• Dual Crop Inference (Flipped vs Unflipped)</text>
    <text x="200" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">• Distance-Based NMS Center Suppression</text>
    <text x="200" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">• FAR False Positive Unit Tests</text>
  </g>

  <!-- Center Channel & Temporal Tracking Box -->
  <g transform="translate(530, 300)" text-anchor="middle">
    <rect x="-20" y="-60" width="160" height="120" rx="12" fill="#0f172a" stroke="#d946ef" stroke-width="2" filter="url(#dropShadow)"/>
    <text y="-32" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#d946ef">TrackedHand state</text>
    <text y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Greedy Match &lt; 400px</text>
    <text y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Hysteresis [-30..+30]</text>
    <line x1="-10" y1="18" x2="130" y2="18" stroke="#334155" stroke-width="1"/>
    <text y="38" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#f97316">mpsc Channel</text>

    <!-- Arrow head right -->
    <path d="M 150 0 L 170 -12 L 170 12 Z" fill="#d946ef"/>
  </g>

  <!-- Right Card: OS Controller & Actions -->
  <g transform="translate(730, 160)" filter="url(#dropShadow)">
    <rect width="380" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Screen Mockup -->
    <rect x="20" y="20" width="340" height="240" rx="10" fill="#070a12" stroke="#334155"/>
    
    <!-- Virtual Desktops Grid -->
    <rect x="40" y="45" width="130" height="90" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="190" y="45" width="130" height="90" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="40" y="150" width="280" height="80" rx="6" fill="#0f172a" stroke="#1e293b"/>

    <!-- Smooth Mouse Cursor Path (EMA) -->
    <path d="M 70 200 Q 150 170 230 100" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="230,100 230,120 242,112 250,125 255,122 247,109 258,109" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Gesture Actions Badges -->
    <g transform="translate(30, 275)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#0284c7"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1 Finger: Hover / Move</text>

      <rect x="170" y="0" width="150" height="32" rx="6" fill="#b91c1c"/>
      <text x="245" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Fist: Click &amp; Drag</text>

      <rect x="0" y="42" width="150" height="32" rx="6" fill="#047857"/>
      <text x="75" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2 Fingers: Scroll</text>

      <rect x="170" y="42" width="150" height="32" rx="6" fill="#6d28d9"/>
      <text x="245" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Wave: Switch Desktop</text>
    </g>

    <text x="190" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#a855f7" text-anchor="middle">OS Controller (Enigo &amp; EMA)</text>
  </g>
</svg>
