<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">*sshole: OpenSSH on musl libc Vulnerability Cascade</title>
  <desc id="desc">Technical analysis of authentication bypass caused by OpenSSH timing attack defense and musl 256-byte SHA-crypt limit</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>

    <!-- Accent Bar Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7768e"/>
      <stop offset="35%" stop-color="#ff9e64"/>
      <stop offset="70%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>

    <!-- Glow Gradients -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7768e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f7768e" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ece6a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#9ece6a" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Subtle Grid Background -->
    <pattern id="bgGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#414868" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#bgGrid)"/>

  <!-- Top Badges & Vulnerability Analysis Header (No repeated title/subtitle) -->
  <g transform="translate(50, 48)">
    <g transform="translate(0, 0)">
      <rect width="135" height="28" rx="14" fill="rgba(247, 118, 142, 0.15)" stroke="#f7768e" stroke-width="1.2"/>
      <text x="67" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#f7768e" text-anchor="middle" letter-spacing="1">CVE ANALYSIS</text>
    </g>
    <g transform="translate(150, 0)">
      <rect width="175" height="28" rx="14" fill="rgba(125, 207, 255, 0.15)" stroke="#7dcfff" stroke-width="1.2"/>
      <text x="87" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#7dcfff" text-anchor="middle" letter-spacing="1">OPENSSH &amp; MUSL LIBC</text>
    </g>
    <g transform="translate(340, 0)">
      <rect width="185" height="28" rx="14" fill="rgba(255, 158, 100, 0.15)" stroke="#ff9e64" stroke-width="1.2"/>
      <text x="92" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#ff9e64" text-anchor="middle" letter-spacing="1">AUTH BYPASS CASCADE</text>
    </g>
    <g transform="translate(540, 0)">
      <rect width="205" height="28" rx="14" fill="rgba(187, 154, 247, 0.15)" stroke="#bb9af7" stroke-width="1.2"/>
      <text x="102" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#bb9af7" text-anchor="middle" letter-spacing="1">SHA-CRYPT 256B LIMIT</text>
    </g>
    <text x="1100" y="20" font-family="'Source Code Pro', monospace" font-size="13" fill="#565f89" text-anchor="end">AUTHENTICATION BYPASS MECHANISM</text>
  </g>

  <!-- Left Card: Terminal Simulation -->
  <g transform="translate(50, 108)">
    <!-- Terminal Outer Frame -->
    <rect width="525" height="470" rx="12" fill="#1f2335" stroke="#414868" stroke-width="1.5"/>
    <!-- Titlebar -->
    <rect width="525" height="42" rx="12" fill="#24283b"/>
    <rect y="30" width="525" height="12" fill="#24283b"/>
    <circle cx="22" cy="21" r="6" fill="#f7768e"/>
    <circle cx="42" cy="21" r="6" fill="#e0af68"/>
    <circle cx="62" cy="21" r="6" fill="#9ece6a"/>
    <text x="262" y="27" font-family="'Source Code Pro', Consolas, monospace" font-size="13" fill="#a9b1d6" text-anchor="middle">流程示意 — ssh alpine@target-host</text>

    <!-- Terminal Content -->
    <g transform="translate(24, 68)" font-family="'Source Code Pro', Consolas, monospace" font-size="13.5" line-height="1.5">
      <!-- Prompt 1 -->
      <text x="0" y="0" fill="#7aa2f7">$ <tspan fill="#c0caf5">ssh -o PasswordAuthentication=yes alpine@10.0.0.42</tspan></text>
      <!-- Password Prompt -->
      <text x="0" y="28" fill="#a9b1d6">alpine@10.0.0.42's password: <tspan fill="#e0af68">AAAA... [257–1024 bytes]</tspan></text>

      <!-- Success Banner -->
      <g transform="translate(0, 52)">
        <rect width="477" height="60" rx="8" fill="url(#greenGlow)" stroke="#9ece6a" stroke-width="1.2"/>
        <text x="16" y="25" font-size="13.5" font-weight="bold" fill="#9ece6a">Welcome to Alpine Linux 3.20 (musl libc)!</text>
        <text x="16" y="47" font-size="12" fill="#c0caf5">Kernel 6.6-lts on x86_64 / sshd: OpenSSH 9.7p1 (without PAM)</text>
      </g>

      <!-- Prompt 2: id command -->
      <text x="0" y="146" fill="#7aa2f7">alpine:~$ <tspan fill="#c0caf5">id</tspan></text>
      <text x="0" y="172" fill="#9ece6a" font-weight="bold">uid=1000(alpine) gid=1000(alpine) groups=1000(alpine),10(wheel)</text>

      <!-- Prompt 3: shadow check -->
      <text x="0" y="214" fill="#7aa2f7">alpine:~$ <tspan fill="#c0caf5">doas grep '^alpine:' /etc/shadow</tspan></text>
      <text x="0" y="240" fill="#f7768e" font-weight="bold">alpine:*:19842:0:99999:7:::</text>
      <text x="38" y="262" font-size="11.5" fill="#ff9e64">└─ 密碼欄位為 "*"（透過 doas 提權檢視）</text>

      <!-- Explanatory note at bottom of terminal -->
      <g transform="translate(0, 305)">
        <rect width="477" height="64" rx="6" fill="rgba(125, 207, 255, 0.12)" stroke="#7dcfff" stroke-width="1"/>
        <text x="14" y="26" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="bold" fill="#7dcfff">ℹ 漏洞觸發條件：</text>
        <text x="14" y="48" font-family="Segoe UI, sans-serif" font-size="12" fill="#c0caf5">無 PAM 支援、shadow 密碼欄位為 * 且帳號具登入權限時觸發認證成功</text>
      </g>
    </g>
  </g>

  <!-- Right Card: Collision Cascade -->
  <g transform="translate(605, 108)">
    <!-- Code Window Outer Frame -->
    <rect width="545" height="470" rx="12" fill="#1f2335" stroke="#414868" stroke-width="1.5"/>
    <!-- Titlebar -->
    <rect width="545" height="42" rx="12" fill="#24283b"/>
    <rect y="30" width="545" height="12" fill="#24283b"/>
    <text x="24" y="27" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#bb9af7">漏洞碰撞鏈分析 (Vulnerability Cascade)</text>
    <text x="521" y="27" font-family="'Source Code Pro', monospace" font-size="12" fill="#565f89" text-anchor="end">auth-passwd.c</text>

    <!-- Cascade Steps -->
    <g transform="translate(24, 60)" font-family="'Source Code Pro', Consolas, monospace">
      <!-- Step 1: 1980 Unix Convention -->
      <g transform="translate(0, 0)">
        <rect width="497" height="46" rx="6" fill="#16161e" stroke="#414868" stroke-width="1"/>
        <text x="14" y="28" font-size="13" fill="#7dcfff">pw_password = <tspan fill="#f7768e" font-weight="bold">"*"</tspan>;</text>
        <text x="210" y="28" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9b1d6">// 1980 Unix: /etc/passwd 特殊標記</text>
      </g>

      <!-- Step 2: 2016 Timing Attack Defense -->
      <g transform="translate(0, 60)">
        <rect width="497" height="46" rx="6" fill="#16161e" stroke="#414868" stroke-width="1"/>
        <text x="14" y="28" font-size="13" fill="#7dcfff">salt = <tspan fill="#bb9af7">pick_salt()</tspan>;</text>
        <text x="210" y="28" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9b1d6">// 2016 OpenSSH 防計時攻擊借用 salt</text>
      </g>

      <!-- Step 3: 2012 musl 256-byte limit -->
      <g transform="translate(0, 120)">
        <rect width="497" height="58" rx="6" fill="#16161e" stroke="#f7768e" stroke-width="1"/>
        <text x="14" y="24" font-size="13" fill="#7dcfff">hash = <tspan fill="#ff9e64">crypt(pw_len_300, salt)</tspan>;</text>
        <text x="14" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#e0af68">└─ 2012 musl: SHA-crypt 長度 &gt;256 位元組失敗，回傳 <tspan font-family="monospace" font-weight="bold" fill="#f7768e">"*"</tspan></text>
      </g>

      <!-- Step 4: Comparison Match (Bypass) -->
      <g transform="translate(0, 192)">
        <rect width="497" height="84" rx="8" fill="url(#redGlow)" stroke="#f7768e" stroke-width="1.5"/>
        <text x="16" y="28" font-size="15" font-weight="bold" fill="#f7768e">strcmp(hash, pw_password) == 0</text>
        <text x="16" y="52" font-size="13" font-weight="bold" fill="#c0caf5">➔ strcmp(<tspan fill="#f7768e">"*"</tspan>, <tspan fill="#f7768e">"*"</tspan>) == 0 <tspan fill="#9ece6a">【比對吻合，認證通過】</tspan></text>
        <text x="16" y="72" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#a9b1d6">兩處獨立歷史決策在 257–1024 位元組輸入下意外吻合</text>
      </g>

      <!-- Step 5: Fix -->
      <g transform="translate(0, 290)">
        <rect width="497" height="88" rx="6" fill="#16161e" stroke="#9ece6a" stroke-width="1.2"/>
        <text x="16" y="24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#7dcfff">OpenSSH 10.6p2 修補措施：</text>
        <text x="16" y="46" font-size="11.5" fill="#a9b1d6">1. 密碼為 "*" 時提早返回拒絕（避免參與雜湊比對）</text>
        <text x="16" y="66" font-size="11.5" fill="#a9b1d6">2. SHA-crypt 統一限制最大長度為 255 位元組</text>
      </g>
    </g>
  </g>

  <!-- Bottom Area: Tech Tags & Branding -->
  <g transform="translate(50, 615)">
    <!-- Tag 1: OpenSSH -->
    <rect x="0" y="-18" width="95" height="32" rx="6" fill="rgba(125, 207, 255, 0.15)" stroke="#7dcfff" stroke-width="1.2"/>
    <text x="47" y="3" font-family="'Source Code Pro', monospace" font-size="13" fill="#7dcfff" text-anchor="middle">OpenSSH</text>

    <!-- Tag 2: musl libc -->
    <rect x="107" y="-18" width="95" height="32" rx="6" fill="rgba(255, 158, 100, 0.15)" stroke="#ff9e64" stroke-width="1.2"/>
    <text x="154" y="3" font-family="'Source Code Pro', monospace" font-size="13" fill="#ff9e64" text-anchor="middle">musl libc</text>

    <!-- Tag 3: Alpine Linux -->
    <rect x="214" y="-18" width="115" height="32" rx="6" fill="rgba(158, 206, 106, 0.15)" stroke="#9ece6a" stroke-width="1.2"/>
    <text x="271" y="3" font-family="'Source Code Pro', monospace" font-size="13" fill="#9ece6a" text-anchor="middle">Alpine Linux</text>

    <!-- Tag 4: Auth Bypass -->
    <rect x="341" y="-18" width="115" height="32" rx="6" fill="rgba(247, 118, 142, 0.15)" stroke="#f7768e" stroke-width="1.2"/>
    <text x="398" y="3" font-family="'Source Code Pro', monospace" font-size="13" fill="#f7768e" text-anchor="middle">Auth Bypass</text>

    <!-- Tag 5: OpenSSH 10.6p2 -->
    <rect x="468" y="-18" width="145" height="32" rx="6" fill="rgba(187, 154, 247, 0.15)" stroke="#bb9af7" stroke-width="1.2"/>
    <text x="540" y="3" font-family="'Source Code Pro', monospace" font-size="13" fill="#bb9af7" text-anchor="middle">OpenSSH 10.6p2</text>

    <!-- Branding bottom-right -->
    <text x="1100" y="4" font-family="Segoe UI, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.45)" text-anchor="end">
      blog.simplypatrick.com
    </text>
  </g>
</svg>
