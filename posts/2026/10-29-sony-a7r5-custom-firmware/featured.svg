<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="50%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#e0af68"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#73daca"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292e42" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="240" cy="180" r="210" fill="#ff9e64" opacity="0.06"/>
  <circle cx="960" cy="490" r="240" fill="#7aa2f7" opacity="0.07"/>
  <circle cx="620" cy="330" r="190" fill="#bb9af7" opacity="0.05"/>

  <!-- Top Header Banner -->
  <g transform="translate(65, 36)">
    <rect x="0" y="0" width="290" height="32" rx="16" fill="#292e42" stroke="#ff9e64" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="5" fill="#ff9e64"/>
    <text x="34" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" font-weight="bold" fill="#ff9e64">ILCE-7RM5 · BIONZ XR CXD90057</text>

    <rect x="306" y="0" width="224" height="32" rx="16" fill="#292e42" stroke="#7dcfff" stroke-width="1.2"/>
    <text x="418" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" font-weight="bold" fill="#7dcfff" text-anchor="middle">AP aarch64 + CP Cortex-R5</text>

    <rect x="546" y="0" width="234" height="32" rx="16" fill="#292e42" stroke="#9ece6a" stroke-width="1.2"/>
    <text x="663" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" font-weight="bold" fill="#9ece6a" text-anchor="middle">FL2 / FL3 + 12 Custom Looks</text>

    <rect x="796" y="0" width="274" height="32" rx="16" fill="#292e42" stroke="#bb9af7" stroke-width="1.2"/>
    <text x="933" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" font-weight="bold" fill="#bb9af7" text-anchor="middle">Unicorn CPU Gate · RSA-2048</text>
  </g>

  <!-- LEFT PANEL: BIONZ XR Dual-Processor & Creative Look Slots -->
  <g transform="translate(65, 92)">
    <rect x="0" y="0" width="525" height="445" rx="14" fill="#16161e" stroke="#414868" stroke-width="2"/>
    <rect x="0" y="0" width="525" height="38" rx="14" fill="#1f2335"/>
    <rect x="0" y="24" width="525" height="14" fill="#1f2335"/>
    <circle cx="20" cy="19" r="6" fill="#f7768e"/>
    <circle cx="38" cy="19" r="6" fill="#e0af68"/>
    <circle cx="56" cy="19" r="6" fill="#9ece6a"/>
    <text x="262" y="24" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" fill="#a9b1d6" text-anchor="middle">BIONZ XR SoC (CXD90057) — Dual-OS Firmware Architecture</text>

    <!-- AP Block -->
    <rect x="20" y="54" width="485" height="118" rx="10" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5"/>
    <rect x="34" y="66" width="165" height="22" rx="5" fill="#7aa2f7" opacity="0.18"/>
    <text x="44" y="81" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" fill="#7dcfff">AP · Cortex-A35 (64-bit)</text>
    <text x="212" y="81" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#9aa5ce">Sony CE Linux 4.9.337-scel · nflasha15</text>

    <text x="34" y="106" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12.5" fill="#c0caf5">/lib/appFw.so (97 MB ELF)  ➔  +40 KB Code Cave @ 0x3c97ef8</text>
    <text x="34" y="128" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#9ece6a">✓ 17 ARM64 Branch Hooks · Dynamic Menu Icons · SD LUT Loader</text>
    <text x="34" y="150" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#e0af68">✓ nflasha5 WBI2 ➔ wbi2 (Warm Boot Snapshot Invalidation)</text>

    <!-- IPC Divider -->
    <line x1="262" y1="172" x2="262" y2="196" stroke="#bb9af7" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="172" y="175" width="180" height="18" rx="9" fill="#24283b" stroke="#bb9af7" stroke-width="1"/>
    <text x="262" y="188" font-family="'Source Code Pro', 'Consolas', monospace" font-size="10.5" fill="#bb9af7" text-anchor="middle">Shared IPC · Look ID 1..12</text>

    <!-- CP Block -->
    <rect x="20" y="196" width="485" height="114" rx="10" fill="#1a1b26" stroke="#ff9e64" stroke-width="1.5"/>
    <rect x="34" y="208" width="165" height="22" rx="5" fill="#ff9e64" opacity="0.18"/>
    <text x="44" y="223" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" fill="#ff9e64">CP · Cortex-R5 (32-bit)</text>
    <text x="212" y="223" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#9aa5ce">TOPPERS/FMP RTOS · nflasha8 (cpapp-b.bin)</text>

    <text x="34" y="248" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12.5" fill="#c0caf5">Relocated 12-Look ISP Tables @ 0x688df740 (167 Patches)</text>
    <text x="34" y="270" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#9ece6a">✓ Tone / Gamma Curves + 184-Byte 5×9×9 3D HSV Grids</text>
    <text x="34" y="292" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#7dcfff">✓ AWB Tweaks (White Priority = 97, Ambience = -1)</text>

    <!-- 12 Creative Look Slots Visual Grid -->
    <rect x="20" y="324" width="485" height="102" rx="10" fill="#1f2335" stroke="#292e42" stroke-width="1.5"/>
    <text x="34" y="346" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" fill="#c0caf5">12 CREATIVE LOOK SLOTS (CUSTOM_F.BIN · 29,552 BYTES)</text>

    <!-- Row of 10 stock + 2 unlocked FL2/FL3 badges -->
    <g transform="translate(32, 358)" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" text-anchor="middle">
      <rect x="0" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="17" y="17" fill="#a9b1d6">ST</text>
      <rect x="38" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="55" y="17" fill="#a9b1d6">PT</text>
      <rect x="76" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="93" y="17" fill="#a9b1d6">NT</text>
      <rect x="114" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="131" y="17" fill="#a9b1d6">VV</text>
      <rect x="152" y="0" width="36" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="170" y="17" fill="#a9b1d6">VV2</text>
      <rect x="192" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="209" y="17" fill="#a9b1d6">FL</text>
      <rect x="230" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="247" y="17" fill="#a9b1d6">IN</text>
      <rect x="268" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="285" y="17" fill="#a9b1d6">SH</text>
      <rect x="306" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="323" y="17" fill="#a9b1d6">BW</text>
      <rect x="344" y="0" width="34" height="26" rx="4" fill="#24283b" stroke="#565f89"/><text x="361" y="17" fill="#a9b1d6">SE</text>
      <!-- Highlighted FL2 & FL3 -->
      <rect x="384" y="0" width="38" height="26" rx="4" fill="#3d292a" stroke="#ff9e64" stroke-width="1.8"/><text x="403" y="17" fill="#ff9e64">FL2</text>
      <rect x="426" y="0" width="38" height="26" rx="4" fill="#1e3430" stroke="#9ece6a" stroke-width="1.8"/><text x="445" y="17" fill="#9ece6a">FL3</text>
    </g>
    <text x="34" y="408" font-family="'Source Code Pro', 'Consolas', monospace" font-size="11.5" fill="#7dcfff">CC (Classic Chrome) · NC (Classic Neg) · NN (Nostalgic Neg) · ETERNA · ACROS</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(598, 295)">
    <line x1="0" y1="20" x2="36" y2="20" stroke="url(#accentCyan)" stroke-width="3"/>
    <polygon points="33,12 45,20 33,28" fill="#7dcfff"/>
  </g>

  <!-- RIGHT PANEL: Unicorn Emulation, Encryption & Fastboot Trust Chain -->
  <g transform="translate(650, 92)">
    <rect x="0" y="0" width="485" height="445" rx="14" fill="#16161e" stroke="#7aa2f7" stroke-width="2"/>
    <rect x="0" y="0" width="485" height="38" rx="14" fill="#1f2335"/>
    <rect x="0" y="24" width="485" height="14" fill="#1f2335"/>
    <circle cx="20" cy="19" r="6" fill="#f7768e"/>
    <circle cx="38" cy="19" r="6" fill="#e0af68"/>
    <circle cx="56" cy="19" r="6" fill="#9ece6a"/>
    <text x="242" y="24" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" fill="#7dcfff" text-anchor="middle">Verification · UFU Crypto · Fastboot Trust Chain</text>

    <!-- Box 1: Unicorn CPU Emulation Gate -->
    <rect x="20" y="54" width="445" height="106" rx="10" fill="#1a1b26" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="34" y="78" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" font-weight="bold" fill="#9ece6a">1. Pre-Flash Unicorn CPU Emulation Gate</text>
    <text x="34" y="101" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#c0caf5">• Emulate ARM64 appFw.so &amp; ARM32 cpapp-b.bin in RAM</text>
    <text x="34" y="122" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#c0caf5">• Sweep Look IDs 1..12 across all getter functions</text>
    <text x="34" y="143" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#73daca">• Look 1..10 bit-exact stock parity · FL2/FL3 zero fault</text>

    <!-- Box 2: BODYDATA.DAT Packaging & Encryption -->
    <rect x="20" y="176" width="445" height="114" rx="10" fill="#1a1b26" stroke="#bb9af7" stroke-width="1.5"/>
    <text x="34" y="200" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" font-weight="bold" fill="#bb9af7">2. BODYDATA.DAT (UFU Container · 754.5 MB)</text>
    <text x="34" y="223" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#c0caf5">• FdatHeader + updater.img + firmware.tar (nflasha*)</text>
    <text x="34" y="244" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#c0caf5">• 736,841 × 1,024B Blocks: AES-ECB (512B) + AES-CBC (512B)</text>
    <text x="34" y="265" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#e0af68">• 256-Byte RSA-2048 PKCS#1 v1.5 Signature + DEND CRC32</text>

    <!-- Box 3: Partition 1 (nflasha1) & Mira Android Fastboot -->
    <rect x="20" y="306" width="445" height="120" rx="10" fill="#1a1b26" stroke="#7dcfff" stroke-width="1.5"/>
    <text x="34" y="330" font-family="'Source Code Pro', 'Consolas', monospace" font-size="13" font-weight="bold" fill="#7dcfff">3. Partition 1 (nflasha1) &amp; Mira USB Fastboot</text>
    <text x="34" y="353" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#c0caf5">• UART 48000 baud ➔ [mira] fastboot ready @ 0x92028000</text>
    <text x="34" y="374" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#c0caf5">• USB VID 0x18d1:0x4ee0 (Android Fastboot v0.5 + Sparse)</text>
    <text x="34" y="395" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" fill="#9ece6a">• Swap /etc/VerificationKey.pem + verifyKey() ➔ mov w0,#0</text>
    <text x="34" y="414" font-family="'Source Code Pro', 'Consolas', monospace" font-size="11.5" fill="#7aa2f7">• RSA-2048 VerifySignature() preserved intact</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(65, 560)">
    <rect x="0" y="0" width="1070" height="82" rx="14" fill="#1f2335" stroke="#414868" stroke-width="1.5"/>
    <text x="32" y="34" font-family="'Arvo', 'Georgia', serif" font-size="24" font-weight="bold" fill="#c0caf5">Sony A7R V Custom Firmware Architecture &amp; Local Build</text>
    <text x="32" y="63" font-family="'Source Code Pro', 'Consolas', monospace" font-size="14" fill="#7aa2f7">Dual-OS Reverse Engineering · FL2/FL3 &amp; 3D LUT Calibration · Unicorn Emulation · Fastboot Trust Chain</text>
    <rect x="885" y="21" width="155" height="40" rx="8" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/>
    <text x="962" y="46" font-family="'Source Code Pro', 'Consolas', monospace" font-size="14" font-weight="bold" fill="#9ece6a" text-anchor="middle">v4.34 VERIFIED</text>
  </g>
</svg>
