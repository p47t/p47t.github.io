<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="GhosPTT banner">
  <title>GhosPTT Architecture Banner</title>
  <desc>WebGPU Terminal with libghostty-vt WebAssembly Core</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- CRT Screen Gradient -->
    <linearGradient id="crtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051510"/>
      <stop offset="100%" stop-color="#020906"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0, 0, 0, 0.45)" stroke-width="2"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="240" cy="220" r="280" fill="rgba(34, 197, 94, 0.07)" filter="blur(60px)"/>
  <circle cx="980" cy="460" r="320" fill="rgba(129, 140, 248, 0.08)" filter="blur(80px)"/>

  <!-- Top Badges & Architecture Header (No repeated title/subtitle) -->
  <g transform="translate(60, 48)">
    <g transform="translate(0, 0)">
      <rect width="165" height="28" rx="14" fill="rgba(34, 197, 94, 0.15)" stroke="#22c55e" stroke-width="1.2"/>
      <text x="82" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="1">WEBGPU &amp; WASM</text>
    </g>
    <g transform="translate(180, 0)">
      <rect width="150" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="75" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">LIBGHOSTTY-VT</text>
    </g>
    <g transform="translate(345, 0)">
      <rect width="150" height="28" rx="14" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="75" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">BIG5 &amp; ANSI VT</text>
    </g>
    <g transform="translate(510, 0)">
      <rect width="140" height="28" rx="14" fill="rgba(167, 139, 250, 0.15)" stroke="#a78bfa" stroke-width="1.2"/>
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="1">CRT SHADER</text>
    </g>
    <text x="1080" y="20" font-family="'Source Code Pro', Consolas, monospace" font-size="13" fill="#64748b" text-anchor="end">TERMINAL EMULATION ARCHITECTURE</text>
  </g>

  <!-- Left Window: Simulated PTT CRT Terminal Screen -->
  <g transform="translate(60, 108)">
    <!-- Terminal Outer Frame -->
    <rect width="525" height="470" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 511 0 Q 525 0 525 14 L 525 38 L 0 38 Z" fill="#0f172a"/>
    <circle cx="20" cy="19" r="6" fill="#ef4444"/>
    <circle cx="38" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="56" cy="19" r="6" fill="#10b981"/>
    <text x="262" y="24" font-family="monospace" font-size="12" fill="#64748b" text-anchor="middle">GhosPTT WebGPU Terminal (80x24)</text>

    <!-- CRT Inner Bezel & Screen -->
    <g transform="translate(18, 50)">
      <rect width="489" height="395" rx="8" fill="url(#crtGrad)" stroke="#1e293b" stroke-width="2"/>
      <!-- Scanlines Overlay -->
      <rect width="489" height="395" rx="8" fill="url(#scanlines)" opacity="0.65"/>

      <!-- BBS Header Banner -->
      <rect x="12" y="16" width="465" height="22" fill="#0284c7"/>
      <text x="20" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">【主功能表】 批踢踢實業坊      看板列表 [GhosPTT v1.0]</text>

      <!-- BBS Menu Content -->
      <text x="24" y="70" font-family="monospace" font-size="12" fill="#22c55e">(C)lass</text>
      <text x="96" y="70" font-family="monospace" font-size="12" fill="#e2e8f0">【 分組討論區 】        純幾何 ANSI 色塊覆蓋計算</text>

      <text x="24" y="96" font-family="monospace" font-size="12" fill="#22c55e">(B)oards</text>
      <text x="96" y="96" font-family="monospace" font-size="12" fill="#e2e8f0">【 看板列表 】          891 KiB libghostty-vt WASM 核心</text>

      <text x="24" y="122" font-family="monospace" font-size="12" fill="#22c55e">(F)avorite</text>
      <text x="96" y="122" font-family="monospace" font-size="12" fill="#e2e8f0">【 我的最愛 】          Mode 2027 雙色字與寬度補償</text>

      <!-- Simulated ANSI Art Block -->
      <g transform="translate(24, 150)">
        <rect x="0" y="0" width="14" height="22" fill="#3b82f6"/>
        <rect x="14" y="0" width="14" height="22" fill="#10b981"/>
        <rect x="28" y="0" width="14" height="22" fill="#f59e0b"/>
        <rect x="42" y="0" width="14" height="22" fill="#ec4899"/>
        <text x="68" y="16" font-family="monospace" font-size="11" fill="#94a3b8">WGSL 片元分析色塊 ▁ █ ◢ ◥</text>
      </g>

      <!-- Post URL & Image Preview Card -->
      <g transform="translate(24, 194)">
        <text x="0" y="14" font-family="monospace" font-size="11" fill="#38bdf8" text-decoration="underline">https://i.imgur.com/example_post.png</text>
        <text x="260" y="14" font-family="monospace" font-size="11" fill="#4ade80">[懸停浮窗預覽已就緒]</text>

        <!-- Popover Card Mockup -->
        <g transform="translate(15, 26)">
          <rect width="280" height="120" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
          <rect x="10" y="10" width="140" height="100" rx="4" fill="#1e293b"/>
          <circle cx="80" cy="50" r="18" fill="#38bdf8" opacity="0.3"/>
          <path d="M 30 95 L 65 65 L 90 85 L 120 50 L 145 95 Z" fill="#38bdf8" opacity="0.6"/>
          <text x="165" y="40" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Imgur 預覽</text>
          <text x="165" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">解析度: 1920x1080</text>
          <text x="165" y="80" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">支援燈箱與相簿導覽</text>
          <text x="165" y="100" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8">點擊開啟全螢幕 →</text>
        </g>
      </g>

      <!-- Telemetry Bottom Bar -->
      <rect x="0" y="371" width="489" height="24" fill="#090d16"/>
      <text x="12" y="387" font-family="monospace" font-size="10" fill="#4ade80">● WebGPU</text>
      <text x="80" y="387" font-family="monospace" font-size="10" fill="#94a3b8">[介面示意]</text>
      <text x="160" y="387" font-family="monospace" font-size="10" fill="#94a3b8">Instances: 1,920</text>
      <text x="290" y="387" font-family="monospace" font-size="10" fill="#94a3b8">Atlas: 2048x2048</text>
      <text x="425" y="387" font-family="monospace" font-size="10" fill="#f59e0b">CRT: ON</text>
    </g>
  </g>

  <!-- Right Window: Architecture & Key Innovations -->
  <g transform="translate(615, 108)">
    <rect width="525" height="470" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 511 0 Q 525 0 525 14 L 525 38 L 0 38 Z" fill="#0f172a"/>
    <text x="20" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">核心機制與實作架構</text>
    <text x="505" y="24" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">GhosPTT Architecture</text>

    <!-- 4 Architecture Cards -->
    <g transform="translate(20, 52)">
      <!-- Item 1: WASM Core -->
      <g transform="translate(0, 0)">
        <rect width="485" height="84" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
        <circle cx="28" cy="42" r="14" fill="rgba(59, 130, 246, 0.2)"/>
        <text x="28" y="47" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">WASM</text>
        <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">libghostty-vt 虛擬終端核心</text>
        <text x="56" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">891 KiB 獨立二進位檔；解析 C ABI JSON 結構配置，降低前端記憶體硬編碼</text>
      </g>

      <!-- Item 2: WebGPU & Procedural Blocks -->
      <g transform="translate(0, 98)">
        <rect width="485" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <circle cx="28" cy="42" r="14" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="28" y="47" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">GPU</text>
        <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">WebGPU 實例化繪製與片元幾何色塊</text>
        <text x="56" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">16-float Quad 實例 + 動態 CJK 圖集；片元數學消除色塊 1px 接縫</text>
      </g>

      <!-- Item 3: Big5 & Dual Color -->
      <g transform="translate(0, 196)">
        <rect width="485" height="84" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <circle cx="28" cy="42" r="14" fill="rgba(245, 158, 11, 0.2)"/>
        <text x="28" y="47" font-family="monospace" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="middle">B5</text>
        <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Big5-UAO 與 Mode 2027 雙色字調解</text>
        <text x="56" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">內建 UAO 2.50 解碼日文與簡體；U+0903 結合字元維持 2 格等寬幾何</text>
      </g>

      <!-- Item 4: Modern Web & CRT -->
      <g transform="translate(0, 294)">
        <rect width="485" height="84" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
        <circle cx="28" cy="42" r="14" fill="rgba(139, 92, 246, 0.2)"/>
        <text x="28" y="47" font-family="monospace" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle">CRT</text>
        <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">響應式縮放與復古 CRT 著色器</text>
        <text x="56" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">5:3 視窗自適應縮放；CRT 掃描線與光暈；相簿導覽與按鍵控制</text>
      </g>
    </g>
  </g>

  <!-- Footer Tags & Site Info -->
  <g transform="translate(60, 615)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="85" height="28" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1"/>
    <text x="42" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">c</text>

    <!-- Tag 2 -->
    <rect x="95" y="0" width="85" height="28" rx="6" fill="rgba(129, 140, 248, 0.1)" stroke="#818cf8" stroke-width="1"/>
    <text x="137" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#818cf8" text-anchor="middle">zig</text>

    <!-- Tag 3 -->
    <rect x="190" y="0" width="115" height="28" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1"/>
    <text x="247" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#10b981" text-anchor="middle">webgpu</text>

    <!-- Tag 4 -->
    <rect x="315" y="0" width="105" height="28" rx="6" fill="rgba(244, 63, 94, 0.1)" stroke="#f43f5e" stroke-width="1"/>
    <text x="367" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#f43f5e" text-anchor="middle">ghostty</text>

    <!-- Tag 5 -->
    <rect x="430" y="0" width="125" height="28" rx="6" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1"/>
    <text x="492" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#fbbf24" text-anchor="middle">ai-assisted</text>

    <!-- Domain Branding -->
    <text x="1080" y="19" font-family="'Source Code Pro', Consolas, monospace" font-size="14" fill="#64748b" text-anchor="end">blog.simplypatrick.com</text>
  </g>
</svg>
