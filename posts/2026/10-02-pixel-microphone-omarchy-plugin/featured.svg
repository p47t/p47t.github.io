<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16161e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24283b;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7dcfff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bb9af7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ece6a;stop-opacity:1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2335;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#13141f;stop-opacity:0.95" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7dcfff" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#9ece6a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradient)" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675" />
  </g>

  <!-- Accent top bar -->
  <rect x="70" y="45" width="140" height="5" fill="url(#accentGradient)" rx="2.5"/>

  <!-- Badges & Title -->
  <g transform="translate(70, 70)">
    <!-- Badges -->
    <g>
      <rect x="0" y="0" width="116" height="26" rx="13" fill="#7dcfff" fill-opacity="0.15" stroke="#7dcfff" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="58" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#7dcfff" text-anchor="middle" letter-spacing="0.5">ADB STREAM</text>

      <rect x="126" y="0" width="138" height="26" rx="13" fill="#9ece6a" fill-opacity="0.15" stroke="#9ece6a" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="195" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#9ece6a" text-anchor="middle" letter-spacing="0.5">PIPEWIRE SOURCE</text>

      <rect x="274" y="0" width="142" height="26" rx="13" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="345" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#bb9af7" text-anchor="middle" letter-spacing="0.5">QUICKSHELL QML</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Pocket Mic：Pixel 3 改造為 Omarchy 麥克風插件
    </text>

    <!-- Subtitle -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="17" font-weight="400" fill="#9aa5ce">
      低延遲 ADB 音訊串流 · PipeWire 虛擬音訊源 · 狀態列動態選單與熱插拔
    </text>
  </g>

  <!-- Central Visual Cards -->
  <g transform="translate(70, 205)">
    <!-- Left Card: Android Phone (Pixel 3) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="320" height="360" rx="14" fill="url(#cardGrad)" stroke="#7dcfff" stroke-width="1.5" stroke-opacity="0.6"/>

      <!-- Card Header -->
      <g transform="translate(24, 24)">
        <rect width="40" height="40" rx="10" fill="#7dcfff" fill-opacity="0.15" />
        <!-- Phone outline icon -->
        <rect x="13" y="8" width="14" height="24" rx="3" fill="none" stroke="#7dcfff" stroke-width="1.8" />
        <line x1="17" y1="12" x2="23" y2="12" stroke="#7dcfff" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="20" cy="27" r="1.2" fill="#7dcfff" />

        <text x="52" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#c0caf5">Google Pixel 3</text>
        <text x="52" y="34" font-family="monospace" font-size="12" fill="#7dcfff">Hardware Audio Source</text>
      </g>

      <!-- Inner Phone Mockup Illustration -->
      <g transform="translate(40, 85)">
        <rect width="240" height="150" rx="8" fill="#16161e" stroke="#292e42" stroke-width="1.2" />

        <!-- Microphone wave visualization -->
        <g transform="translate(30, 40)">
          <!-- Mic icon -->
          <rect x="0" y="0" width="16" height="26" rx="8" fill="none" stroke="#9ece6a" stroke-width="2" />
          <path d="M -6 14 C -6 24 22 24 22 14" fill="none" stroke="#9ece6a" stroke-width="2" />
          <line x1="8" y1="24" x2="8" y2="34" stroke="#9ece6a" stroke-width="2" />
          <line x1="0" y1="34" x2="16" y2="34" stroke="#9ece6a" stroke-width="2" />

          <!-- Sound waves -->
          <path d="M 30 8 C 36 12 36 22 30 26" fill="none" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" />
          <path d="M 38 3 C 48 10 48 24 38 31" fill="none" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
          <path d="M 46 -2 C 60 7 60 27 46 36" fill="none" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" opacity="0.4" />
        </g>

        <!-- Spec tags inside card -->
        <g transform="translate(100, 32)">
          <text x="0" y="14" font-family="monospace" font-size="12" font-weight="bold" fill="#c0caf5">AudioRecord API</text>
          <text x="0" y="32" font-family="monospace" font-size="11" fill="#7982a9">44.1 kHz · 16-bit PCM</text>
          <text x="0" y="50" font-family="monospace" font-size="11" fill="#7982a9">Dual-mic Noise Cancel</text>
          <text x="0" y="68" font-family="monospace" font-size="11" fill="#9ece6a">localabstract:audiosource</text>
        </g>
      </g>

      <!-- Bottom badge -->
      <g transform="translate(24, 255)">
        <rect width="272" height="75" rx="8" fill="#1a1b26" stroke="#2f354a" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#7dcfff">USB / Wireless ADB</text>
        <text x="14" y="44" font-family="monospace" font-size="11" fill="#9aa5ce">adb forward localabstract:audiosource</text>
        <text x="14" y="62" font-family="monospace" font-size="11" fill="#565f89">Near-zero overhead · No network lag</text>
      </g>
    </g>

    <!-- Flow Arrow 1 -->
    <g transform="translate(335, 160)">
      <circle cx="20" cy="20" r="18" fill="#1f2335" stroke="#7dcfff" stroke-width="1.5" />
      <path d="M 14 20 L 26 20 M 21 15 L 26 20 L 21 25" fill="none" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Center Card: Python Daemon & PipeBridge -->
    <g transform="translate(390, 0)" filter="url(#shadow)">
      <rect width="320" height="360" rx="14" fill="url(#cardGrad)" stroke="#ff9e64" stroke-width="1.5" stroke-opacity="0.6"/>

      <!-- Card Header -->
      <g transform="translate(24, 24)">
        <rect width="40" height="40" rx="10" fill="#ff9e64" fill-opacity="0.15" />
        <!-- Stream pipe icon -->
        <path d="M 10 14 L 30 14 M 10 26 L 30 26 M 15 14 C 15 20 15 26 15 26 M 25 14 C 25 20 25 26 25 26" fill="none" stroke="#ff9e64" stroke-width="1.8" stroke-linecap="round" />

        <text x="52" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#c0caf5">pocket-mic (Rust)</text>
        <text x="52" y="34" font-family="monospace" font-size="12" fill="#ff9e64">Native Audio &amp; Process Bridge</text>
      </g>

      <!-- Inner Box: Features -->
      <g transform="translate(24, 85)">
        <rect width="272" height="150" rx="8" fill="#16161e" stroke="#292e42" stroke-width="1.2" />

        <g transform="translate(16, 22)">
          <!-- Feature 1 -->
          <circle cx="6" cy="6" r="3" fill="#ff9e64" />
          <text x="18" y="10" font-family="monospace" font-size="12" font-weight="bold" fill="#c0caf5">RAII Resource Management</text>
          <text x="18" y="26" font-family="monospace" font-size="11" fill="#7982a9">Drop: auto pactl &amp; adb cleanup</text>

          <!-- Feature 2 -->
          <circle cx="6" cy="48" r="3" fill="#9ece6a" />
          <text x="18" y="52" font-family="monospace" font-size="12" font-weight="bold" fill="#c0caf5">Zero Idle Polling Overhead</text>
          <text x="18" y="68" font-family="monospace" font-size="11" fill="#7982a9">Fast native binary on-demand poll</text>

          <!-- Feature 3 -->
          <circle cx="6" cy="90" r="3" fill="#7dcfff" />
          <text x="18" y="94" font-family="monospace" font-size="12" font-weight="bold" fill="#c0caf5">PipeWire Virtual Source</text>
          <text x="18" y="110" font-family="monospace" font-size="11" fill="#7982a9">Non-blocking FIFO (F_SETPIPE_SZ)</text>
        </g>
      </g>

      <!-- Bottom Status -->
      <g transform="translate(24, 255)">
        <rect width="272" height="75" rx="8" fill="#1a1b26" stroke="#2f354a" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#9ece6a">Named Device Description</text>
        <text x="14" y="44" font-family="monospace" font-size="11" fill="#9aa5ce">"Pixel 3 Microphone"</text>
        <text x="14" y="62" font-family="monospace" font-size="11" fill="#565f89">Auto module unload &amp; deduplication</text>
      </g>
    </g>

    <!-- Flow Arrow 2 -->
    <g transform="translate(725, 160)">
      <circle cx="20" cy="20" r="18" fill="#1f2335" stroke="#bb9af7" stroke-width="1.5" />
      <path d="M 14 20 L 26 20 M 21 15 L 26 20 L 21 25" fill="none" stroke="#bb9af7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Right Card: Omarchy Quickshell Plugin -->
    <g transform="translate(780, 0)" filter="url(#shadow)">
      <rect width="320" height="360" rx="14" fill="url(#cardGrad)" stroke="#bb9af7" stroke-width="1.5" stroke-opacity="0.6"/>

      <!-- Card Header -->
      <g transform="translate(24, 24)">
        <rect width="40" height="40" rx="10" fill="#bb9af7" fill-opacity="0.15" />
        <!-- Widget / layout icon -->
        <rect x="10" y="10" width="20" height="6" rx="2" fill="#bb9af7" />
        <rect x="10" y="20" width="9" height="10" rx="2" fill="#bb9af7" opacity="0.7" />
        <rect x="21" y="20" width="9" height="10" rx="2" fill="#bb9af7" opacity="0.7" />

        <text x="52" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#c0caf5">Omarchy Quickshell</text>
        <text x="52" y="34" font-family="monospace" font-size="12" fill="#bb9af7">Service &amp; BarWidget.qml</text>
      </g>

      <!-- Inner UI Mockup -->
      <g transform="translate(24, 85)">
        <rect width="272" height="150" rx="8" fill="#16161e" stroke="#292e42" stroke-width="1.2" />

        <!-- Mock Dropdown Card Header -->
        <g transform="translate(14, 16)">
          <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#c0caf5">Android microphones</text>
          <text x="215" y="12" font-family="monospace" font-size="12" fill="#7dcfff">󰑐</text>
        </g>

        <!-- Selected Row -->
        <g transform="translate(14, 40)">
          <rect width="244" height="46" rx="5" fill="#20808080" stroke="#7dcfff" stroke-width="1" />
          <text x="12" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#9ece6a">☑</text>
          <text x="36" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Pixel 3</text>
          <text x="36" y="36" font-family="monospace" font-size="10" fill="#9ece6a">89AY04L52 · Ready</text>
        </g>

        <!-- Idle Hint -->
        <g transform="translate(14, 98)">
          <text x="0" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#7982a9">Status: Connected to Pixel 3</text>
          <text x="0" y="30" font-family="monospace" font-size="10" fill="#565f89">Keyboard Nav: Tab / Space / Enter</text>
        </g>
      </g>

      <!-- Bottom Integration -->
      <g transform="translate(24, 255)">
        <rect width="272" height="75" rx="8" fill="#1a1b26" stroke="#2f354a" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#bb9af7">Desktop First-Class Audio</text>
        <text x="14" y="44" font-family="monospace" font-size="11" fill="#9aa5ce">Google Meet · Discord · Voxtype</text>
        <text x="14" y="62" font-family="monospace" font-size="11" fill="#565f89">One-click toggle · 5s auto-reconnect</text>
      </g>
    </g>
  </g>

  <!-- Bottom Tech Tags -->
  <g transform="translate(600, 620)">
    <!-- Tag 1: Android -->
    <g transform="translate(-220, 0)">
      <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#9ece6a" fill-opacity="0.15" stroke="#9ece6a" stroke-width="1.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" font-weight="bold" fill="#9ece6a" text-anchor="middle">Android</text>
    </g>

    <!-- Tag 2: Linux -->
    <g transform="translate(-110, 0)">
      <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#7dcfff" fill-opacity="0.15" stroke="#7dcfff" stroke-width="1.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" font-weight="bold" fill="#7dcfff" text-anchor="middle">Linux</text>
    </g>

    <!-- Tag 3: PipeWire -->
    <g transform="translate(0, 0)">
      <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7" stroke-width="1.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" font-weight="bold" fill="#bb9af7" text-anchor="middle">PipeWire</text>
    </g>

    <!-- Tag 4: Quickshell -->
    <g transform="translate(110, 0)">
      <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#ff9e64" fill-opacity="0.15" stroke="#ff9e64" stroke-width="1.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" font-weight="bold" fill="#ff9e64" text-anchor="middle">Quickshell</text>
    </g>

    <!-- Tag 5: Rust -->
    <g transform="translate(220, 0)">
      <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#ff9e64" fill-opacity="0.15" stroke="#ff9e64" stroke-width="1.2"/>
      <text x="0" y="5" font-family="monospace" font-size="12" font-weight="bold" fill="#ff9e64" text-anchor="middle">Rust</text>
    </g>
  </g>

  <!-- Branding -->
  <text x="1130" y="625" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.4)" text-anchor="end">
    blog.simplypatrick.com
  </text>
</svg>
