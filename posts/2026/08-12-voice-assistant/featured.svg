<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070a14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#05070f;stop-opacity:1" />
    </linearGradient>

    <!-- Rust Orange Gradient -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>

    <!-- Cyan/Teal Voice Wave Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <!-- Purple Glow Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7e22ce;stop-opacity:1" />
    </linearGradient>

    <!-- Emerald Success Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="220" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="260" fill="#f97316" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="330" r="280" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Tech Circuit Lines & Nodes -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M 100 120 L 300 120 L 380 200 L 500 200" stroke-dasharray="6,6" />
    <path d="M 1100 150 L 920 150 L 840 230 L 700 230" stroke-dasharray="6,6" />
    <path d="M 150 550 L 350 550 L 420 480 L 550 480" />
    <path d="M 1050 580 L 880 580 L 800 500 L 680 500" />
    <circle cx="380" cy="200" r="4" fill="#38bdf8" />
    <circle cx="840" cy="230" r="4" fill="#38bdf8" />
    <circle cx="420" cy="480" r="4" fill="#38bdf8" />
    <circle cx="800" cy="500" r="4" fill="#38bdf8" />
  </g>

  <!-- Central Audio Waveform Visualizer -->
  <g transform="translate(600, 240)">
    <!-- Audio Waveform Bars (Symmetrical Spectrum) -->
    <rect x="-240" y="-20" width="8" height="40" rx="4" fill="url(#cyanGrad)" opacity="0.6" />
    <rect x="-220" y="-35" width="8" height="70" rx="4" fill="url(#cyanGrad)" opacity="0.7" />
    <rect x="-200" y="-15" width="8" height="30" rx="4" fill="url(#cyanGrad)" opacity="0.5" />
    <rect x="-180" y="-50" width="8" height="100" rx="4" fill="url(#purpleGrad)" opacity="0.8" />
    <rect x="-160" y="-30" width="8" height="60" rx="4" fill="url(#purpleGrad)" opacity="0.7" />
    <rect x="-140" y="-75" width="8" height="150" rx="4" fill="url(#cyanGrad)" filter="url(#subtleGlow)" />
    <rect x="-120" y="-45" width="8" height="90" rx="4" fill="url(#cyanGrad)" />
    <rect x="-100" y="-100" width="8" height="200" rx="4" fill="url(#rustGrad)" filter="url(#subtleGlow)" />
    <rect x="-80" y="-60" width="8" height="120" rx="4" fill="url(#purpleGrad)" />
    <rect x="-60" y="-120" width="8" height="240" rx="4" fill="url(#cyanGrad)" filter="url(#glow)" />
    <rect x="-40" y="-80" width="8" height="160" rx="4" fill="url(#cyanGrad)" />
    <rect x="-20" y="-140" width="8" height="280" rx="4" fill="url(#rustGrad)" filter="url(#glow)" />
    <rect x="0" y="-160" width="8" height="320" rx="4" fill="#ffffff" filter="url(#glow)" />
    <rect x="20" y="-140" width="8" height="280" rx="4" fill="url(#rustGrad)" filter="url(#glow)" />
    <rect x="40" y="-80" width="8" height="160" rx="4" fill="url(#cyanGrad)" />
    <rect x="60" y="-120" width="8" height="240" rx="4" fill="url(#cyanGrad)" filter="url(#glow)" />
    <rect x="80" y="-60" width="8" height="120" rx="4" fill="url(#purpleGrad)" />
    <rect x="100" y="-100" width="8" height="200" rx="4" fill="url(#rustGrad)" filter="url(#subtleGlow)" />
    <rect x="120" y="-45" width="8" height="90" rx="4" fill="url(#cyanGrad)" />
    <rect x="140" y="-75" width="8" height="150" rx="4" fill="url(#cyanGrad)" filter="url(#subtleGlow)" />
    <rect x="160" y="-30" width="8" height="60" rx="4" fill="url(#purpleGrad)" opacity="0.7" />
    <rect x="180" y="-50" width="8" height="100" rx="4" fill="url(#purpleGrad)" opacity="0.8" />
    <rect x="200" y="-15" width="8" height="30" rx="4" fill="url(#cyanGrad)" opacity="0.5" />
    <rect x="220" y="-35" width="8" height="70" rx="4" fill="url(#cyanGrad)" opacity="0.7" />
    <rect x="240" y="-20" width="8" height="40" rx="4" fill="url(#cyanGrad)" opacity="0.6" />
  </g>

  <!-- Central AI Microphone Sphere Ring -->
  <g transform="translate(600, 240)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#f97316" stroke-width="2" opacity="0.4" stroke-dasharray="8,8" />
    <circle cx="0" cy="0" r="75" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#subtleGlow)" />
    <!-- Microphone Icon -->
    <path d="M -12 -15 A 12 12 0 0 1 12 -15 L 12 5 A 12 12 0 0 1 -12 5 Z" fill="url(#cyanGrad)" />
    <path d="M -18 2 A 18 18 0 0 0 18 2" fill="none" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="20" x2="0" y2="30" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
    <line x1="-12" y1="30" x2="12" y2="30" stroke="#f8fafc" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Header Badge: Capstone Project #52 -->
  <g transform="translate(600, 85)">
    <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#1e293b" stroke="url(#rustGrad)" stroke-width="2" filter="url(#subtleGlow)" />
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="2">
      RUST 52 PROJECTS · CAPSTONE #52
    </text>
  </g>

  <!-- Main Title & Subtitle -->
  <g transform="translate(600, 475)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1" filter="url(#subtleGlow)">
      Local Offline Voice Assistant
    </text>
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="middle">
      Gemma-4 Multimodal LLM · WebRTC APM · openWakeWord · Windows TTS
    </text>
  </g>

  <!-- Bottom Technology Tech Pills -->
  <g transform="translate(600, 595)">
    <!-- Pill 1: Rust Engine -->
    <g transform="translate(-320, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#f97316" stroke-width="1.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#fdba74" text-anchor="middle">Rust (CPAL)</text>
    </g>

    <!-- Pill 2: WebRTC APM -->
    <g transform="translate(-160, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">WebRTC APM</text>
    </g>

    <!-- Pill 3: openWakeWord -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">openWakeWord</text>
    </g>

    <!-- Pill 4: Gemma-4 Multimodal -->
    <g transform="translate(160, 0)">
      <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">Gemma-4 Multimodal</text>
    </g>

    <!-- Pill 5: Vulkan GPU -->
    <g transform="translate(320, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#1e293b" stroke="#e879f9" stroke-width="1.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="13" font-weight="600" fill="#f0abfc" text-anchor="middle">Vulkan GPU</text>
    </g>
  </g>
</svg>
