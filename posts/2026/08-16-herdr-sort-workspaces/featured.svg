<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Decorative Circuit / Grid subtle elements -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675" />
  </g>

  <!-- Top Badges & Architecture Header (No repeated title/subtitle) -->
  <g transform="translate(80, 48)">
    <g transform="translate(0, 0)">
      <rect width="100" height="28" rx="14" fill="#00599C" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="50" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">C++23</text>
    </g>
    <g transform="translate(115, 0)">
      <rect width="135" height="28" rx="14" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="67" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fb923c" text-anchor="middle" letter-spacing="0.5">CABIN BUILD</text>
    </g>
    <g transform="translate(265, 0)">
      <rect width="145" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="72" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="0.5">HERDR PLUGIN</text>
    </g>
    <g transform="translate(425, 0)">
      <rect width="140" height="28" rx="14" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">STD::RANGES</text>
    </g>
    <g transform="translate(580, 0)">
      <rect width="115" height="28" rx="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="57" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#7dd3fc" text-anchor="middle" letter-spacing="0.5">FTXUI TUI</text>
    </g>
    <text x="1040" y="20" font-family="'Source Code Pro', Consolas, monospace" font-size="13" fill="#64748b" text-anchor="end">MODERN C++23 EXTENSION ARCHITECTURE</text>
  </g>

  <!-- Content Cards Grid -->
  <!-- Left Card: Cabin & Modern C++23 Paradigm -->
  <g transform="translate(80, 110)" filter="url(#dropShadow)">
    <rect width="495" height="475" rx="16" fill="url(#cardBg)" stroke="#f97316" stroke-width="2" stroke-opacity="0.75" />
    
    <!-- Card Header -->
    <rect x="20" y="20" width="455" height="46" rx="8" fill="#f97316" fill-opacity="0.12" />
    <circle cx="44" cy="43" r="11" fill="#f97316" />
    <text x="44" y="47" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">📦</text>
    <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#fb923c">
      Cabin Package Manager &amp; C++23
    </text>
    <text x="455" y="48" font-family="monospace" font-size="12" font-weight="600" fill="#fdba74" text-anchor="end">
      cabin.toml
    </text>

    <!-- Code / Config Box -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="455" height="175" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      
      <!-- Window Controls -->
      <circle cx="16" cy="16" r="4.5" fill="#ef4444" opacity="0.8"/>
      <circle cx="28" cy="16" r="4.5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="40" cy="16" r="4.5" fill="#10b981" opacity="0.8"/>
      <text x="60" y="20" font-family="monospace" font-size="11" fill="#64748b">cabin.toml (Declarative Cargo-like)</text>

      <text x="16" y="48" font-family="monospace" font-size="12" fill="#94a3b8">[package] <tspan fill="#f97316">cxx-standard = "c++23"</tspan></text>
      <text x="16" y="72" font-family="monospace" font-size="12" fill="#94a3b8">[dependencies]</text>
      <text x="16" y="96" font-family="monospace" font-size="12" fill="#38bdf8">nlohmann_json <tspan fill="#64748b">=</tspan> <tspan fill="#34d399">{ port = true, version = "^3.12" }</tspan></text>
      <text x="16" y="118" font-family="monospace" font-size="12" fill="#38bdf8">CLI11         <tspan fill="#64748b">=</tspan> <tspan fill="#34d399">{ port = true, version = "^2.6" }</tspan></text>
      <text x="16" y="140" font-family="monospace" font-size="12" fill="#38bdf8">ftxui         <tspan fill="#64748b">=</tspan> <tspan fill="#cbd5e1">{ path = "third_party/ftxui" }</tspan></text>
      <text x="16" y="162" font-family="monospace" font-size="12" fill="#38bdf8">catch2        <tspan fill="#64748b">=</tspan> <tspan fill="#34d399">{ port = true, version = "^3.15" }</tspan></text>
    </g>

    <!-- C++23 Feature Highlights -->
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="220" height="120" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">std::expected&lt;T, E&gt;</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Monadic 錯誤處理</text>
      <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• 告別例外與錯誤碼混亂</text>
      <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ 嚴格類型安全防護</text>

      <rect x="235" y="0" width="220" height="120" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f97316">std::ranges &amp; 3-Way</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• stable_sort / partition</text>
      <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• std::string_view 零拷貝</text>
      <text x="14" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ 自然字母數字三向比較</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="20" y="415" width="455" height="34" rx="6" fill="#f97316" fill-opacity="0.1" />
    <text x="247" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#fb923c" text-anchor="middle">
      ✓ 擺脫 CMake 繁瑣樣板 · cabin build / cabin test 快速完成
    </text>
  </g>

  <!-- Right Card: herdr Sorting Architecture & FTXUI -->
  <g transform="translate(625, 110)" filter="url(#dropShadow)">
    <rect width="495" height="475" rx="16" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75" />
    
    <!-- Card Header -->
    <rect x="20" y="20" width="455" height="46" rx="8" fill="#38bdf8" fill-opacity="0.12" />
    <circle cx="44" cy="43" r="11" fill="#0284c7" />
    <text x="44" y="47" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">
      Sorting Logic &amp; FTXUI Live Preview
    </text>
    <text x="455" y="48" font-family="monospace" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="end">
      IPC + Permutation
    </text>

    <!-- FTXUI Terminal Preview Simulation -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="455" height="175" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      
      <!-- Terminal Header -->
      <rect x="0" y="0" width="455" height="26" rx="8" fill="#1e293b" fill-opacity="0.7" />
      <text x="12" y="18" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">❖ HERDR WORKSPACE SORTER (FTXUI)</text>
      <text x="440" y="18" font-family="monospace" font-size="11" fill="#facc15" text-anchor="end">Total: 4</text>

      <!-- List items -->
      <g transform="translate(12, 42)" font-family="monospace" font-size="11.5">
        <text x="0" y="12" fill="#64748b">1 [0]  blog.simplypatrick.com  <tspan fill="#34d399">➔  1 [0] (unchanged)</tspan></text>
        
        <rect x="-4" y="22" width="435" height="24" rx="4" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="0.8"/>
        <text x="0" y="38" fill="#38bdf8" font-weight="700">2 [1]  cabin-build-runner      ➔  3 [2] (swap down)</text>

        <text x="0" y="64" fill="#64748b">3 [2]  agentic-dev-session     <tspan fill="#f59e0b">➔  2 [1] (promoted)</tspan></text>
        <text x="0" y="90" fill="#64748b">4 [3]  hyprland-dotfiles       <tspan fill="#34d399">➔  4 [3] (unchanged)</tspan></text>
      </g>

      <!-- Shortcut Bar -->
      <rect x="0" y="145" width="455" height="30" fill="#0f172a" />
      <text x="12" y="165" font-family="monospace" font-size="11" fill="#94a3b8">
        <tspan fill="#38bdf8">[Enter]</tspan> Apply Permutation  <tspan fill="#f43f5e">[Esc]</tspan> Abort  <tspan fill="#34d399">[r]</tspan> Reverse
      </text>
    </g>

    <!-- Pipeline Architecture Breakdown -->
    <g transform="translate(20, 275)">
      <rect x="0" y="0" width="455" height="120" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Permutation Generator (二進位調換序列)</text>

      <!-- Flow step arrows -->
      <g transform="translate(16, 42)" font-family="monospace" font-size="11">
        <rect x="0" y="0" width="125" height="56" rx="6" fill="#1e293b" />
        <text x="62" y="24" fill="#94a3b8" text-anchor="middle">Workspace List</text>
        <text x="62" y="42" fill="#34d399" text-anchor="middle">[0, 1, 2, 3]</text>

        <text x="140" y="32" fill="#38bdf8" font-size="14">➔</text>

        <rect x="155" y="0" width="125" height="56" rx="6" fill="#1e293b" />
        <text x="217" y="24" fill="#94a3b8" text-anchor="middle">Stable Sort</text>
        <text x="217" y="42" fill="#fb923c" text-anchor="middle">Natural Alpha</text>

        <text x="295" y="32" fill="#38bdf8" font-size="14">➔</text>

        <rect x="310" y="0" width="115" height="56" rx="6" fill="#1e293b" />
        <text x="367" y="24" fill="#94a3b8" text-anchor="middle">Socket IPC</text>
        <text x="367" y="42" fill="#38bdf8" text-anchor="middle">herdr swap</text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <rect x="20" y="415" width="455" height="34" rx="6" fill="#38bdf8" fill-opacity="0.1" />
    <text x="247" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8" text-anchor="middle">
      ✓ 嚴格驗證排列非循環 · 一鍵恢復原始排序狀態
    </text>
  </g>

  <!-- Footer Branding -->
  <text x="1120" y="635" font-family="monospace" font-size="13" fill="#475569" text-anchor="end">blog.simplypatrick.com</text>
</svg>
