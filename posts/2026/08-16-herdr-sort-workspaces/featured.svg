<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c14;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050810;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00599C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004482;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675" />
  </g>

  <!-- Top Title Area -->
  <g transform="translate(80, 65)">
    <!-- Badges Row -->
    <g>
      <!-- C++23 Badge -->
      <rect x="0" y="0" width="90" height="28" rx="14" fill="#00599C" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="45" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">C++23</text>

      <!-- Cabin / Cargo Badge -->
      <rect x="100" y="0" width="130" height="28" rx="14" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="165" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fb923c" text-anchor="middle" letter-spacing="0.5">CABIN BUILD</text>

      <!-- herdr Plugin Badge -->
      <rect x="240" y="0" width="140" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="310" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="0.5">HERDR PLUGIN</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      herdr-sort-workspaces
    </text>
    <text x="495" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#38bdf8" letter-spacing="-0.5">
      現代 C++23 外掛實戰
    </text>

    <!-- Subtitle -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      宛如 Rust Cargo 般的 Cabin 開發生態 · std::ranges 自然排序 · FTXUI 終端即時預覽
    </text>
  </g>

  <!-- Content Cards Grid -->
  <!-- Left Card: Cabin & Modern C++23 Paradigm -->
  <g transform="translate(80, 215)" filter="url(#dropShadow)">
    <rect width="495" height="395" rx="16" fill="url(#cardBg)" stroke="#f97316" stroke-width="2" stroke-opacity="0.75" />
    
    <!-- Card Header -->
    <rect x="20" y="20" width="455" height="46" rx="8" fill="#f97316" fill-opacity="0.12" />
    <circle cx="44" cy="43" r="11" fill="#f97316" />
    <text x="44" y="47" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">📦</text>
    <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#fb923c">
      Cabin Package Manager &amp; C++23
    </text>
    <text x="455" y="48" font-family="monospace" font-size="12" font-weight="600" fill="#fdba74" text-anchor="end">
      cabin.toml
    </text>

    <!-- Code / Config Box -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="455" height="150" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      
      <!-- Window Controls -->
      <circle cx="16" cy="16" r="4.5" fill="#ef4444" opacity="0.8"/>
      <circle cx="28" cy="16" r="4.5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="40" cy="16" r="4.5" fill="#10b981" opacity="0.8"/>
      <text x="60" y="20" font-family="monospace" font-size="11" fill="#64748b">cabin.toml (Declarative Cargo-like)</text>

      <text x="16" y="45" font-family="monospace" font-size="12" fill="#94a3b8">[package] <tspan fill="#f97316">cxx-standard = "c++23"</tspan></text>
      <text x="16" y="65" font-family="monospace" font-size="12" fill="#94a3b8">[dependencies]</text>
      <text x="16" y="85" font-family="monospace" font-size="12" fill="#38bdf8">nlohmann_json <tspan fill="#64748b">=</tspan> <tspan fill="#34d399">{ port = true, version = "^3.12" }</tspan></text>
      <text x="16" y="105" font-family="monospace" font-size="12" fill="#38bdf8">CLI11         <tspan fill="#64748b">=</tspan> <tspan fill="#34d399">{ port = true, version = "^2.6" }</tspan></text>
      <text x="16" y="125" font-family="monospace" font-size="12" fill="#38bdf8">ftxui         <tspan fill="#64748b">=</tspan> <tspan fill="#cbd5e1">{ path = "third_party/ftxui" }</tspan></text>
      <text x="16" y="145" font-family="monospace" font-size="12" fill="#38bdf8">catch2        <tspan fill="#64748b">=</tspan> <tspan fill="#34d399">{ port = true, version = "^3.15" }</tspan></text>
    </g>

    <!-- C++23 Feature Highlights -->
    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">std::expected&lt;T, E&gt;</text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• Monadic 錯誤處理</text>
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• 告別例外與錯誤碼混亂</text>
      <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ 嚴格類型安全防護</text>

      <rect x="235" y="0" width="220" height="90" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f97316">std::ranges &amp; 3-Way</text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• stable_sort / partition</text>
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• std::string_view 零拷貝</text>
      <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ 自然字母數字三向比較</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="20" y="348" width="455" height="30" rx="6" fill="#f97316" fill-opacity="0.1" />
    <text x="247" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">
      ✓ 擺脫 CMake 繁瑣樣板 · cabin build / cabin test 快速完成
    </text>
  </g>

  <!-- Right Card: herdr Sorting Architecture & FTXUI -->
  <g transform="translate(625, 215)" filter="url(#dropShadow)">
    <rect width="495" height="395" rx="16" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75" />
    
    <!-- Card Header -->
    <rect x="20" y="20" width="455" height="46" rx="8" fill="#38bdf8" fill-opacity="0.12" />
    <circle cx="44" cy="43" r="11" fill="#0284c7" />
    <text x="44" y="47" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">
      Sorting Logic &amp; FTXUI Live Preview
    </text>
    <text x="455" y="48" font-family="monospace" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="end">
      IPC + Permutation
    </text>

    <!-- FTXUI Terminal Preview Simulation -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="455" height="150" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      
      <!-- Terminal Header -->
      <rect x="0" y="0" width="455" height="24" rx="8" fill="#1e293b" fill-opacity="0.7" />
      <text x="12" y="16" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">❖ HERDR WORKSPACE SORTER (FTXUI)</text>
      <text x="440" y="16" font-family="monospace" font-size="11" fill="#facc15" text-anchor="end">Total: 4</text>

      <!-- Table Row 1 -->
      <text x="12" y="44" font-family="monospace" font-size="11" fill="#64748b">1. <tspan fill="#38bdf8">w3</tspan>  <tspan fill="#facc15">★</tspan>  <tspan fill="#34d399">● working</tspan>  2p/3t  <tspan fill="#ffffff" font-weight="700">alpha-2</tspan>      <tspan fill="#34d399">+2</tspan></text>
      <!-- Table Row 2 -->
      <text x="12" y="66" font-family="monospace" font-size="11" fill="#64748b">2. <tspan fill="#38bdf8">w2</tspan>     <tspan fill="#eab308">▲ blocked</tspan>  4p/2t  <tspan fill="#ffffff" font-weight="700">alpha-10</tspan>     <tspan fill="#64748b"> 0</tspan></text>
      <!-- Table Row 3 -->
      <text x="12" y="88" font-family="monospace" font-size="11" fill="#64748b">3. <tspan fill="#38bdf8">w4</tspan>     <tspan fill="#60a5fa">✓ done</tspan>     5p/1t  <tspan fill="#ffffff" font-weight="700">beta</tspan>         <tspan fill="#ef4444">-1</tspan></text>
      <!-- Table Row 4 -->
      <text x="12" y="110" font-family="monospace" font-size="11" fill="#64748b">4. <tspan fill="#38bdf8">w1</tspan>     <tspan fill="#94a3b8">○ idle</tspan>     1p/1t  <tspan fill="#ffffff" font-weight="700">zebra</tspan>        <tspan fill="#ef4444">-3</tspan></text>

      <rect x="8" y="124" width="439" height="20" rx="4" fill="#1e293b" />
      <text x="16" y="138" font-family="monospace" font-size="10" fill="#facc15">[1-8] Strategy  [r] Reverse  [f] Pin Focus  [Enter] Apply</text>
    </g>

    <!-- Architecture Stats / Highlights -->
    <g transform="translate(20, 245)">
      <rect x="0" y="0" width="220" height="90" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">自然排序 (Natural Sort)</text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• 分塊數位比對 (alpha-2 &lt; 10)</text>
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• 前導零偏置 Tie-Breaker</text>
      <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ 支援任意長度大數值</text>

      <rect x="235" y="0" width="220" height="90" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">最小重排操作計算</text>
      <text x="14" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• 置換狀態機演算法</text>
      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">• herdr Socket RPC 傳輸</text>
      <text x="14" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ 185+ Catch2 測試斷言</text>
    </g>

    <!-- Bottom summary tag -->
    <rect x="20" y="348" width="455" height="30" rx="6" fill="#38bdf8" fill-opacity="0.1" />
    <text x="247" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">
      ✓ Unix Socket IPC · 雙重 CLI 容錯 · 8 種排序策略 + 互動 TUI
    </text>
  </g>
</svg>
