<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050811;stop-opacity:1" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>

    <linearGradient id="coreCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cabinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Cybernetic Grid Pattern -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="180" fill="#0284c7" opacity="0.12" filter="blur(80px)" />
  <circle cx="600" cy="380" r="220" fill="#6366f1" opacity="0.15" filter="blur(90px)" />
  <circle cx="1000" cy="220" r="180" fill="#10b981" opacity="0.1" filter="blur(80px)" />

  <!-- Top Title & Badge Area -->
  <g transform="translate(80, 55)">
    <!-- Badges Row -->
    <g>
      <!-- C++23 Badge -->
      <rect x="0" y="0" width="84" height="26" rx="13" fill="#00599C" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="42" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.5">C++23</text>

      <!-- Coroutines Badge -->
      <rect x="94" y="0" width="136" height="26" rx="13" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="162" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="0.5">Task&lt;T&gt; Coroutines</text>

      <!-- epoll EventLoop Badge -->
      <rect x="240" y="0" width="124" height="26" rx="13" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="302" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle" letter-spacing="0.5">Linux epoll I/O</text>

      <!-- OpenAI Compatible Badge -->
      <rect x="374" y="0" width="150" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.2" />
      <text x="449" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle" letter-spacing="0.5">OpenAI Compatible</text>

      <!-- Cabin Badge -->
      <rect x="534" y="0" width="90" height="26" rx="13" fill="#ea580c" fill-opacity="0.25" stroke="#f97316" stroke-opacity="0.6" stroke-width="1.2" />
      <text x="579" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="0.5">Cabin</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
      High-Performance C++23 AI Gateway
    </text>

    <!-- Subtitle -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
      極簡高效 · Stackless 協程 · 零框架 epoll 異步架構 · SSE 串流轉發與加權輪詢
    </text>
  </g>

  <!-- 3-Column Visual Architecture -->
  <g transform="translate(80, 205)">
    
    <!-- LEFT CARD: Downstream Clients & OpenAI Protocols -->
    <g transform="translate(0, 0)" filter="url(#dropShadow)">
      <rect width="280" height="400" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
      
      <!-- Card Header -->
      <rect width="280" height="48" rx="16" fill="#0f172a" />
      <rect y="36" width="280" height="12" fill="#0f172a" />
      <circle cx="24" cy="24" r="6" fill="#38bdf8" />
      <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Downstream Clients</text>
      
      <!-- Inner Elements -->
      <g transform="translate(18, 64)">
        <!-- API Client Types -->
        <rect width="244" height="44" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">OpenAI Python / Node SDK</text>
        <text x="14" y="36" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#94a3b8">curl / Agent CLI / IDE plugins</text>

        <!-- Route 1: Chat Completion -->
        <g transform="translate(0, 56)">
          <rect width="244" height="68" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3" />
          <text x="12" y="22" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8">POST /v1/chat/completions</text>
          <text x="12" y="40" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#cbd5e1">{ "model": "llama3.3",</text>
          <text x="12" y="56" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#34d399">  "stream": true }</text>
        </g>

        <!-- Route 2: Other Endpoints -->
        <g transform="translate(0, 136)">
          <rect width="244" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="12" y="20" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#94a3b8">POST /v1/embeddings</text>
          <text x="12" y="36" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#94a3b8">GET /v1/models</text>
          <text x="12" y="52" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#34d399">GET /healthz</text>
        </g>

        <!-- Feature Pill -->
        <g transform="translate(0, 210)">
          <rect width="244" height="100" rx="8" fill="#0c4a6e" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
          <text x="12" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc">⚡ Real-Time Streaming SSE</text>
          <text x="12" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#bae6fd">• Out-of-band token forward</text>
          <text x="12" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#bae6fd">• Zero-copy stream writer</text>
          <text x="12" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#bae6fd">• Auto CORS preflight</text>
        </g>
      </g>
    </g>

    <!-- CENTER CARD: AI Gateway Core Engine -->
    <g transform="translate(340, 0)" filter="url(#coreGlow)">
      <rect width="360" height="400" rx="16" fill="url(#coreCardBg)" stroke="#818cf8" stroke-width="2" />
      
      <!-- Card Header -->
      <rect width="360" height="48" rx="16" fill="#1e1b4b" />
      <rect y="36" width="360" height="12" fill="#1e1b4b" />
      <circle cx="24" cy="24" r="6" fill="#a855f7" />
      <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#ffffff">AI Gateway Engine (C++23)</text>
      
      <!-- Engine Blocks Inside -->
      <g transform="translate(20, 64)">
        
        <!-- Block 1: EventLoop & Coroutines -->
        <rect width="320" height="88" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
        <g transform="translate(14, 18)">
          <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">Linux epoll EventLoop &amp; Coroutine Runtime</text>
          <text x="0" y="20" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#818cf8">• Task&lt;T&gt; promise_type &amp; std::coroutine_handle</text>
          <text x="0" y="38" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#818cf8">• Non-blocking co_await AsyncReadable / Writable</text>
          <text x="0" y="54" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#818cf8">• Priority Queue Timers &amp; async_sleep</text>
        </g>

        <!-- Block 2: Zero-Copy Parser & Router -->
        <g transform="translate(0, 100)">
          <rect width="320" height="106" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
          <g transform="translate(14, 18)">
            <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">picohttpparser &amp; Model Routing</text>
            <text x="0" y="20" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#93c5fd">• Zero-memory copy HTTP Request/Response</text>
            <text x="0" y="38" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#93c5fd">• Wildcard matching (llama*, qwen*, *)</text>
            <text x="0" y="56" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#93c5fd">• Dynamic payload model alias rewriting</text>
            <text x="0" y="74" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#93c5fd">• 16MB buffer guard &amp; safe Content-Length</text>
          </g>
        </g>

        <!-- Block 3: Load Balancing & Failover -->
        <g transform="translate(0, 218)">
          <rect width="320" height="92" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
          <g transform="translate(14, 18)">
            <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#34d399">Resilience &amp; Load Balancer</text>
            <text x="0" y="20" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#a7f3d0">• Atomic Weighted Round-Robin (WRR)</text>
            <text x="0" y="38" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#a7f3d0">• Circuit breaker failure backoff window</text>
            <text x="0" y="56" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#a7f3d0">• Transparent multi-node failover retry</text>
          </g>
        </g>
      </g>
    </g>

    <!-- RIGHT CARD: Upstream Backend Clusters -->
    <g transform="translate(760, 0)" filter="url(#dropShadow)">
      <rect width="280" height="400" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
      
      <!-- Card Header -->
      <rect width="280" height="48" rx="16" fill="#0f172a" />
      <rect y="36" width="280" height="12" fill="#0f172a" />
      <circle cx="24" cy="24" r="6" fill="#f97316" />
      <text x="40" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Upstream Inference Nodes</text>
      
      <!-- Upstream Nodes List -->
      <g transform="translate(18, 64)">
        <!-- Node 1: Ollama -->
        <rect width="244" height="74" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fdba74">Ollama Cluster (local)</text>
        <text x="14" y="42" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#cbd5e1">127.0.0.1:11434</text>
        <text x="14" y="60" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#34d399">● HEALTHY · weight: 2</text>

        <!-- Node 2: vLLM / TGI -->
        <g transform="translate(0, 86)">
          <rect width="244" height="74" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
          <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#c7d2fe">vLLM / TGI High-Throughput</text>
          <text x="14" y="42" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#cbd5e1">10.0.0.5:8000</text>
          <text x="14" y="60" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#34d399">● HEALTHY · weight: 5</text>
        </g>

        <!-- Node 3: Cloud / Backup Fallback -->
        <g transform="translate(0, 172)">
          <rect width="244" height="74" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">Cloud Provider Fallback</text>
          <text x="14" y="42" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#cbd5e1">api.openai.com:443</text>
          <text x="14" y="60" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#fbbf24">○ STANDBY · Failover Ready</text>
        </g>

        <!-- Metric Tag -->
        <g transform="translate(0, 258)">
          <rect width="244" height="52" rx="8" fill="#14532d" fill-opacity="0.3" stroke="#22c55e" stroke-width="1" />
          <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#86efac">Zero Framework Overhead</text>
          <text x="12" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#bbf7d0">&lt; 100μs Dispatch Latency · Zero Copy</text>
        </g>
      </g>
    </g>

    <!-- Interactive Data Flow Connectors -->
    <!-- Left to Center Arrow -->
    <g transform="translate(280, 170)">
      <path d="M 0 30 L 60 30" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4" />
      <polygon points="56,24 64,30 56,36" fill="#38bdf8" />
      <rect x="8" y="10" width="44" height="16" rx="4" fill="#0c4a6e" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle">HTTP</text>
    </g>

    <!-- Center to Right Arrow -->
    <g transform="translate(700, 170)">
      <path d="M 0 30 L 60 30" stroke="#34d399" stroke-width="3" stroke-dasharray="6,4" />
      <polygon points="56,24 64,30 56,36" fill="#34d399" />
      <rect x="8" y="10" width="44" height="16" rx="4" fill="#064e3b" />
      <text x="30" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#6ee7b7" text-anchor="middle">PROXY</text>
    </g>

    <!-- Return SSE Arrow (Right to Center to Left) -->
    <g transform="translate(280, 240)">
      <path d="M 60 30 L 0 30" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4" />
      <polygon points="4,24 -4,30 4,36" fill="#a855f7" />
      <rect x="8" y="12" width="44" height="16" rx="4" fill="#3b0764" />
      <text x="30" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#d8b4fe" text-anchor="middle">SSE</text>
    </g>
    <g transform="translate(700, 240)">
      <path d="M 60 30 L 0 30" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4" />
      <polygon points="4,24 -4,30 4,36" fill="#a855f7" />
      <rect x="8" y="12" width="44" height="16" rx="4" fill="#3b0764" />
      <text x="30" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#d8b4fe" text-anchor="middle">CHUNK</text>
    </g>

  </g>
</svg>
