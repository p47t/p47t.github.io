<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a12;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="composeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ddc84;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#be123c;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Decorative Circuit / Grid subtle elements -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200" />
    <path d="M150 0 V675 M300 0 V675 M450 0 V675 M600 0 V675 M750 0 V675 M900 0 V675 M1050 0 V675" />
  </g>

  <!-- Top Title Area -->
  <g transform="translate(80, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#3ddc84" fill-opacity="0.15" stroke="#3ddc84" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="85" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#3ddc84" text-anchor="middle" letter-spacing="1">JETPACK COMPOSE</text>

    <!-- Main Title -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      MiniCompose
    </text>
    <text x="290" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" fill="#38bdf8" letter-spacing="-0.5">
      渲染引擎手刻實戰
    </text>

    <!-- Subtitle -->
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      從零實作 5 大核心設計決策與 1000-Node 雙向動畫微秒級（µs）效能基準測試
    </text>
  </g>

  <!-- Benchmark Comparison Cards -->
  <!-- Left Card: GPU graphicsLayer (Draw Phase) -->
  <g transform="translate(80, 225)" filter="url(#dropShadow)">
    <rect width="490" height="375" rx="16" fill="url(#cardBg1)" stroke="#3ddc84" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Card Header -->
    <rect x="20" y="20" width="450" height="48" rx="8" fill="#3ddc84" fill-opacity="0.1" />
    <circle cx="45" cy="44" r="10" fill="#3ddc84" />
    <text x="45" y="48" font-family="sans-serif" font-size="12" font-weight="900" fill="#0b0f19" text-anchor="middle">⚡</text>
    <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#3ddc84">
      Modifier.graphicsLayer
    </text>
    <text x="450" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#10b981" text-anchor="end">
      Draw Phase (GPU)
    </text>

    <!-- Card Content -->
    <g transform="translate(24, 90)">
      <!-- RenderNode Box -->
      <rect x="0" y="0" width="442" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">RenderNode (Native C++)</text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">• Header Properties (<tspan fill="#3ddc84" font-weight="700">&lt; 1 µs</tspan> float write)</text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">• Display List: <tspan fill="#94a3b8">Immutable (No Re-record)</tspan></text>
      <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">• Re-layout: <tspan fill="#3ddc84" font-weight="700">SKIPPED (0 Nodes Traversed)</tspan></text>

      <!-- Benchmark Stats -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="210" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Layout Phase Time</text>
        <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#3ddc84">0 <tspan font-size="16" font-weight="500">µs</tspan></text>
        
        <rect x="232" y="0" width="210" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="248" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">1000-Node FPS</text>
        <text x="248" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#38bdf8">60 <tspan font-size="16" font-weight="500">FPS</tspan></text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <rect x="24" y="330" width="442" height="28" rx="6" fill="#3ddc84" fill-opacity="0.1" />
    <text x="245" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#3ddc84" text-anchor="middle">
      ✓ 硬體矩陣變換 · 零物件分配 · 絲滑流暢
    </text>
  </g>

  <!-- Right Card: CPU offset (Layout Phase) -->
  <g transform="translate(630, 225)" filter="url(#dropShadow)">
    <rect width="490" height="375" rx="16" fill="url(#cardBg1)" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Card Header -->
    <rect x="20" y="20" width="450" height="48" rx="8" fill="#f43f5e" fill-opacity="0.1" />
    <circle cx="45" cy="44" r="10" fill="#f43f5e" />
    <text x="45" y="48" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">⚠️</text>
    <text x="68" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f43f5e">
      Modifier.offset
    </text>
    <text x="450" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fb7185" text-anchor="end">
      Layout Phase (CPU)
    </text>

    <!-- Card Content -->
    <g transform="translate(24, 90)">
      <!-- Layout Tree Box -->
      <rect x="0" y="0" width="442" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="16" y="26" font-family="monospace" font-size="13" font-weight="700" fill="#fb7185">LayoutCoordinates Pipeline</text>
      <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">• Tree Traversal: <tspan fill="#f43f5e" font-weight="700">100% Recursive Walk</tspan></text>
      <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">• Text/Constraint: <tspan fill="#f43f5e">Re-measure per frame</tspan></text>
      <text x="16" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#cbd5e1">• Display List: <tspan fill="#fb7185">Invalidated &amp; Re-recorded</tspan></text>

      <!-- Benchmark Stats -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="210" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">1000-Node Layout Time</text>
        <text x="16" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#f43f5e">~3,100 <tspan font-size="16" font-weight="500">µs</tspan></text>
        
        <rect x="232" y="0" width="210" height="90" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="248" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Layout Passes / sec</text>
        <text x="248" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#fb7185">60 <tspan font-size="16" font-weight="500">passes/s</tspan></text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <rect x="24" y="330" width="442" height="28" rx="6" fill="#f43f5e" fill-opacity="0.1" />
    <text x="245" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f43f5e" text-anchor="middle">
      ⚠️ 遞迴重新排版 · CPU 重複開銷 · 微秒量測顯著差異
    </text>
  </g>
</svg>
