<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a12;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="220" cy="220" r="220" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="980" cy="450" r="250" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Header Banner Title -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="1">Cross-Platform Rust IP Camera &amp; MJPEG Server</text>
    <text y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">OpenCV 5 Pipeline • Axum 0.7 Async Streaming • Tokio watch Channel</text>
  </g>

  <!-- Left Card: OpenCV 5 Capture & CV Pipeline -->
  <g transform="translate(90, 160)" filter="url(#dropShadow)">
    <rect width="400" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Camera Feed Viewport Mockup -->
    <rect x="20" y="20" width="360" height="240" rx="10" fill="#090d16" stroke="#1e293b"/>
    
    <!-- Radar Target Scope (Mock Camera Feed) -->
    <circle cx="200" cy="140" r="80" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="200" cy="140" r="50" fill="none" stroke="#334155" stroke-width="1.5"/>
    <circle cx="200" cy="140" r="20" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="200" y1="50" x2="200" y2="230" stroke="#1e293b" stroke-width="1"/>
    <line x1="110" y1="140" x2="290" y2="140" stroke="#1e293b" stroke-width="1"/>
    <!-- Radar Beam -->
    <line x1="200" y1="140" x2="260" y2="95" stroke="#10b981" stroke-width="2" filter="url(#glow)"/>

    <!-- HUD Target Bounding Box & Red Scanning Laser -->
    <rect x="130" y="85" width="140" height="110" fill="none" stroke="#6366f1" stroke-width="2"/>
    <!-- Corner Accents (Green) -->
    <path d="M 130 95 L 130 85 L 140 85" fill="none" stroke="#10b981" stroke-width="3"/>
    <path d="M 270 95 L 270 85 L 260 85" fill="none" stroke="#10b981" stroke-width="3"/>
    <path d="M 130 185 L 130 195 L 140 195" fill="none" stroke="#10b981" stroke-width="3"/>
    <path d="M 270 185 L 270 195 L 260 195" fill="none" stroke="#10b981" stroke-width="3"/>
    <!-- Red Laser Line -->
    <line x1="132" y1="135" x2="268" y2="135" stroke="#ef4444" stroke-width="2" filter="url(#glow)"/>

    <!-- Overlay Text Badges -->
    <text x="35" y="45" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#10b981">STREAM: ACTIVE | 30.0 FPS</text>
    <text x="35" y="62" font-family="Consolas, Monaco, monospace" font-size="10" fill="#94a3b8">2026-08-09 11:32:00.124</text>

    <!-- Description -->
    <text x="200" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#6366f1" text-anchor="middle">Capture Loop (spawn_blocking)</text>
    <text x="200" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">• OpenCV 5 Mat Capture &amp; Mock Radar Fallback</text>
    <text x="200" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">• EMA FPS, HUD Bounding Box &amp; Laser Scan</text>
    <text x="200" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">• Worker-Thread imencode JPEG (85% Quality)</text>
  </g>

  <!-- Center Channel & Shared Memory Bridge -->
  <g transform="translate(530, 300)" text-anchor="middle">
    <rect x="-20" y="-55" width="160" height="110" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="url(#dropShadow)"/>
    <text y="-25" font-family="Consolas, Monaco, monospace" font-size="12" font-weight="700" fill="#f97316">Arc&lt;Mutex&lt;Vec&lt;u8&gt;&gt;&gt;</text>
    <text y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Latest JPEG Bytes</text>
    <line x1="-10" y1="8" x2="130" y2="8" stroke="#334155" stroke-width="1"/>
    <text y="28" font-family="Consolas, Monaco, monospace" font-size="12" font-weight="700" fill="#10b981">tokio::sync::watch</text>
    <text y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Async Frame Notification</text>

    <!-- Arrow head right -->
    <path d="M 150 0 L 170 -12 L 170 12 Z" fill="#10b981"/>
  </g>

  <!-- Right Card: Axum Async Web Server & Dashboard -->
  <g transform="translate(730, 160)" filter="url(#dropShadow)">
    <rect width="380" height="430" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Browser Dashboard Mockup -->
    <rect x="20" y="20" width="340" height="240" rx="10" fill="#070a12" stroke="#334155"/>
    
    <!-- Browser Top Bar -->
    <rect x="20" y="20" width="340" height="28" rx="10" fill="#1e293b"/>
    <circle cx="35" cy="34" r="4" fill="#ef4444"/>
    <circle cx="47" cy="34" r="4" fill="#f59e0b"/>
    <circle cx="59" cy="34" r="4" fill="#10b981"/>
    <rect x="75" y="26" width="220" height="16" rx="4" fill="#0f172a"/>
    <text x="185" y="38" font-family="Consolas, Monaco, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">http://localhost:8080</text>

    <!-- Stream View Area inside Browser -->
    <rect x="35" y="60" width="310" height="150" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="190" y="130" font-family="Consolas, Monaco, monospace" font-size="12" fill="#10b981" text-anchor="middle">GET /stream (MJPEG)</text>
    <text x="190" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">multipart/x-mixed-replace</text>

    <!-- Dashboard Feature Badges -->
    <g transform="translate(30, 275)">
      <rect x="0" y="0" width="150" height="32" rx="6" fill="#4f46e5"/>
      <text x="75" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Axum 0.7 Router</text>

      <rect x="170" y="0" width="150" height="32" rx="6" fill="#059669"/>
      <text x="245" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Non-Blocking Tokio</text>

      <rect x="0" y="42" width="150" height="32" rx="6" fill="#0284c7"/>
      <text x="75" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Glassmorphic UI</text>

      <rect x="170" y="42" width="150" height="32" rx="6" fill="#d946ef"/>
      <text x="245" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Win / Linux / RPi 4</text>
    </g>

    <text x="190" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#10b981" text-anchor="middle">Axum Web Server (http://localhost:8080)</text>
  </g>
</svg>
