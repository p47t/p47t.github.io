<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Memory Ordering &amp; Atomics Architecture</title>
  <desc id="desc">Hardware cache coherence, compiler optimization barriers, and acquire-release synchronization chain</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#ff9e64"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#7dcfff" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#9ece6a" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Top Badges & Architecture Header (No repeated title/subtitle) -->
  <g transform="translate(60, 48)">
    <g transform="translate(0, 0)">
      <rect width="170" height="28" rx="14" fill="rgba(125, 207, 255, 0.15)" stroke="#7dcfff" stroke-width="1.2"/>
      <text x="85" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#7dcfff" text-anchor="middle" letter-spacing="0.5">MEMORY ORDERING</text>
    </g>
    <g transform="translate(185, 0)">
      <rect width="180" height="28" rx="14" fill="rgba(187, 154, 247, 0.15)" stroke="#bb9af7" stroke-width="1.2"/>
      <text x="90" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#bb9af7" text-anchor="middle" letter-spacing="0.5">ACQUIRE / RELEASE</text>
    </g>
    <g transform="translate(380, 0)">
      <rect width="170" height="28" rx="14" fill="rgba(158, 206, 106, 0.15)" stroke="#9ece6a" stroke-width="1.2"/>
      <text x="85" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#9ece6a" text-anchor="middle" letter-spacing="0.5">HAPPENS-BEFORE</text>
    </g>
    <g transform="translate(565, 0)">
      <rect width="165" height="28" rx="14" fill="rgba(255, 158, 100, 0.15)" stroke="#ff9e64" stroke-width="1.2"/>
      <text x="82" y="19" font-family="'Source Code Pro', monospace" font-size="12" font-weight="700" fill="#ff9e64" text-anchor="middle" letter-spacing="0.5">CACHE COHERENCE</text>
    </g>
    <text x="1080" y="20" font-family="'Source Code Pro', monospace" font-size="13" fill="#565f89" text-anchor="end">CONCURRENCY &amp; MEMORY MODEL</text>
  </g>

  <!-- Central Architecture Diagram -->
  <!-- Thread 1: Writer -->
  <g transform="translate(60, 115)">
    <rect width="320" height="320" rx="12" fill="#1f2335" stroke="#414868" stroke-width="1.5"/>
    <rect width="320" height="42" rx="12" fill="#24283b"/>
    <rect y="30" width="320" height="12" fill="#24283b"/>
    <text x="160" y="27" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#7dcfff" text-anchor="middle">Thread A (Writer)</text>

    <!-- Operations inside Thread 1 -->
    <g transform="translate(20, 68)" font-family="Consolas, 'Source Code Pro', monospace" font-size="14">
      <rect width="280" height="52" rx="6" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
      <text x="15" y="32" fill="#a9b1d6">data = 42 <tspan fill="#565f89">// payload</tspan></text>

      <path d="M140 60 V88" stroke="#565f89" stroke-width="2" stroke-dasharray="3 3"/>

      <rect y="96" width="280" height="60" rx="6" fill="#1a1b26" stroke="#bb9af7" stroke-width="1.5"/>
      <text x="15" y="122" fill="#bb9af7" font-weight="600">ready.store(true,</text>
      <text x="25" y="144" fill="#7dcfff">std::memory_order_release)</text>
    </g>

    <!-- Sequenced-before annotation -->
    <rect x="20" y="255" width="280" height="40" rx="6" fill="#24283b" stroke="#565f89" stroke-width="1"/>
    <text x="160" y="280" font-family="Segoe UI, sans-serif" font-size="13" fill="#9aa5ce" text-anchor="middle">sequenced-before (程式序保證) ↓</text>
  </g>

  <!-- Middle Hardware / Sync Barrier Layer -->
  <g transform="translate(420, 115)">
    <rect width="360" height="320" rx="12" fill="#1f2335" stroke="#7aa2f7" stroke-width="1" stroke-dasharray="6 4"/>
    <text x="180" y="34" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#7aa2f7" text-anchor="middle">Synchronizes-With (跨執行緒同步橋樑)</text>

    <!-- Hardware layers -->
    <g transform="translate(20, 60)" font-family="Segoe UI, sans-serif" font-size="13">
      <rect width="320" height="44" rx="6" fill="#24283b" stroke="#414868" stroke-width="1"/>
      <text x="160" y="28" fill="#c0caf5" text-anchor="middle">Compiler Optimization Barrier (禁止重排)</text>

      <rect y="56" width="320" height="44" rx="6" fill="#24283b" stroke="#414868" stroke-width="1"/>
      <text x="160" y="84" fill="#c0caf5" text-anchor="middle">Store Buffer / Load Queue Memory Barrier</text>

      <rect y="112" width="320" height="44" rx="6" fill="#24283b" stroke="#414868" stroke-width="1"/>
      <text x="160" y="140" fill="#c0caf5" text-anchor="middle">Cache Coherence Protocol (MESI / MOESI)</text>
    </g>

    <!-- Happpens-before indicator -->
    <g transform="translate(30, 245)">
      <rect width="300" height="50" rx="8" fill="#292e42" stroke="#9ece6a" stroke-width="1.5"/>
      <text x="150" y="31" font-family="Consolas, monospace" font-size="14.5" font-weight="600" fill="#9ece6a" text-anchor="middle">happens-before 關係成立 ✓</text>
    </g>
  </g>

  <!-- Thread 2: Reader -->
  <g transform="translate(820, 115)">
    <rect width="320" height="320" rx="12" fill="#1f2335" stroke="#414868" stroke-width="1.5"/>
    <rect width="320" height="42" rx="12" fill="#24283b"/>
    <rect y="30" width="320" height="12" fill="#24283b"/>
    <text x="160" y="27" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#9ece6a" text-anchor="middle">Thread B (Reader)</text>

    <!-- Operations inside Thread 2 -->
    <g transform="translate(20, 68)" font-family="Consolas, 'Source Code Pro', monospace" font-size="14">
      <rect width="280" height="60" rx="6" fill="#1a1b26" stroke="#9ece6a" stroke-width="1.5"/>
      <text x="15" y="26" fill="#9ece6a" font-weight="600">ready.load(</text>
      <text x="25" y="48" fill="#7dcfff">std::memory_order_acquire) == true</text>

      <path d="M140 68 V96" stroke="#565f89" stroke-width="2" stroke-dasharray="3 3"/>

      <rect y="104" width="280" height="52" rx="6" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
      <text x="15" y="136" fill="#a9b1d6">assert(data == 42); <tspan fill="#9ece6a">✓ 安全讀取</tspan></text>
    </g>

    <!-- Sequenced-before annotation -->
    <rect x="20" y="255" width="280" height="40" rx="6" fill="#24283b" stroke="#565f89" stroke-width="1"/>
    <text x="160" y="280" font-family="Segoe UI, sans-serif" font-size="13" fill="#9aa5ce" text-anchor="middle">sequenced-before (可見性保證) ↓</text>
  </g>

  <!-- Connective Arrows -->
  <path d="M380 275 H420" stroke="#bb9af7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M780 275 H820" stroke="#9ece6a" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Bottom Orderings Badges -->
  <g transform="translate(60, 480)" font-family="Consolas, monospace" font-size="14">
    <!-- Relaxed -->
    <g transform="translate(0, 0)">
      <rect width="250" height="74" rx="8" fill="#1f2335" stroke="#ff9e64" stroke-width="1"/>
      <text x="125" y="32" fill="#ff9e64" font-weight="600" text-anchor="middle">Relaxed</text>
      <text x="125" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9b1d6" text-anchor="middle">僅保證單變數原子性與修改序</text>
    </g>
    <!-- Acquire / Release -->
    <g transform="translate(270, 0)">
      <rect width="280" height="74" rx="8" fill="#1f2335" stroke="#7dcfff" stroke-width="1"/>
      <text x="140" y="32" fill="#7dcfff" font-weight="600" text-anchor="middle">Acquire / Release</text>
      <text x="140" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9b1d6" text-anchor="middle">單向屏障 · 配對建立跨執行緒同步鏈</text>
    </g>
    <!-- AcqRel -->
    <g transform="translate(570, 0)">
      <rect width="260" height="74" rx="8" fill="#1f2335" stroke="#bb9af7" stroke-width="1"/>
      <text x="130" y="32" fill="#bb9af7" font-weight="600" text-anchor="middle">AcqRel (RMW)</text>
      <text x="130" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9b1d6" text-anchor="middle">讀取 acquire + 寫入 release</text>
    </g>
    <!-- SeqCst -->
    <g transform="translate(850, 0)">
      <rect width="230" height="74" rx="8" fill="#1f2335" stroke="#f7768e" stroke-width="1"/>
      <text x="115" y="32" fill="#f7768e" font-weight="600" text-anchor="middle">SeqCst</text>
      <text x="115" y="56" font-family="Segoe UI, sans-serif" font-size="12" fill="#a9b1d6" text-anchor="middle">全域單一總序 · 硬體負擔最重</text>
    </g>
  </g>

  <!-- Footer Tags & Domain -->
  <g transform="translate(60, 615)" font-family="Consolas, monospace" font-size="14">
    <rect width="60" height="26" rx="4" fill="#24283b" stroke="#7dcfff"/>
    <text x="30" y="18" fill="#7dcfff" text-anchor="middle">c++</text>
    <rect x="75" width="65" height="26" rx="4" fill="#24283b" stroke="#ff9e64"/>
    <text x="107" y="18" fill="#ff9e64" text-anchor="middle">rust</text>
    <rect x="155" width="135" height="26" rx="4" fill="#24283b" stroke="#9ece6a"/>
    <text x="222" y="18" fill="#9ece6a" text-anchor="middle">memory-model</text>
  </g>
  <text x="1140" y="630" font-family="Segoe UI, sans-serif" font-size="15" fill="#565f89" text-anchor="end">blog.simplypatrick.com</text>
</svg>
