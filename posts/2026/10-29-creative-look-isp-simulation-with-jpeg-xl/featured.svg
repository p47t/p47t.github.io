<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="50%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#7dcfff"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#e0af68"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#73daca"/>
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#292e42" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <circle cx="260" cy="190" r="230" fill="#7aa2f7" opacity="0.08"/>
  <circle cx="940" cy="480" r="250" fill="#bb9af7" opacity="0.07"/>
  <circle cx="600" cy="340" r="180" fill="#73daca" opacity="0.05"/>

  <!-- Top Badges & Architecture Header (No repeated title/subtitle) -->
  <g transform="translate(65, 46)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#292e42" stroke="#7aa2f7" stroke-width="1.4"/>
    <circle cx="18" cy="16" r="5" fill="#7aa2f7"/>
    <text x="34" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" fill="#7aa2f7">CAMERA HARDWARE ISP</text>

    <rect x="235" y="0" width="240" height="32" rx="16" fill="#292e42" stroke="#73daca" stroke-width="1.2"/>
    <text x="355" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" fill="#73daca" text-anchor="middle">JPEG XL 16-BIT LINEAR SIM</text>

    <rect x="490" y="0" width="200" height="32" rx="16" fill="#292e42" stroke="#bb9af7" stroke-width="1.2"/>
    <text x="590" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" fill="#bb9af7" text-anchor="middle">5x9x9 3D POLAR HSV</text>

    <rect x="705" y="0" width="180" height="32" rx="16" fill="#292e42" stroke="#e0af68" stroke-width="1.2"/>
    <text x="795" y="21" font-family="'Source Code Pro', 'Consolas', monospace" font-size="12" font-weight="bold" fill="#e0af68" text-anchor="middle">16-SECTOR MATRIX</text>

    <text x="1070" y="21" font-family="'Source Code Pro', monospace" font-size="12" font-weight="bold" fill="#565f89" text-anchor="end">BIONZ XR HARDWARE PIPELINE</text>
  </g>

  <!-- Main Technical Visual Cards: Pipeline Stages -->
  <g transform="translate(65, 110)">
    <!-- Stage 1: Linear JPEG XL Input -->
    <g transform="translate(0, 0)">
      <rect width="248" height="395" rx="16" fill="#1f2335" stroke="#414868" stroke-width="1.4"/>
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#24283b" stroke="#7aa2f7" stroke-width="1.2"/>
      <text x="38" y="44" font-family="'Source Code Pro', monospace" font-size="16" font-weight="bold" fill="#7aa2f7" text-anchor="middle">01</text>
      <text x="70" y="36" font-family="-apple-system, 'Noto Sans TC', sans-serif" font-size="15" font-weight="bold" fill="#c0caf5">線性數位負片</text>
      <text x="70" y="54" font-family="'Source Code Pro', monospace" font-size="11.5" fill="#565f89">16-bit Linear JXL</text>
      <line x1="18" y1="72" x2="230" y2="72" stroke="#292e42" stroke-width="1"/>
      <text x="18" y="102" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#7dcfff">• Demosaiced Radiance</text>
      <text x="18" y="132" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#7dcfff">• Infinite Dynamic Range</text>
      <text x="18" y="162" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#7dcfff">• Rec.2020 / P3 Gamut</text>
      <text x="18" y="192" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#7dcfff">• Zero Banding Headroom</text>
      <text x="18" y="222" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#7dcfff">• Float Internal Pipeline</text>
      <text x="18" y="252" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#7dcfff">• Reversible Denoise</text>
      <rect x="18" y="352" width="212" height="26" rx="6" fill="#24283b"/>
      <text x="124" y="369" font-family="'Source Code Pro', monospace" font-size="11" fill="#7aa2f7" text-anchor="middle">STAGE: INPUT RADIANCE</text>
    </g>

    <!-- Stage 2: WB & 16-Sector Matrix -->
    <g transform="translate(270, 0)">
      <rect width="248" height="395" rx="16" fill="#1f2335" stroke="#414868" stroke-width="1.4"/>
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#24283b" stroke="#73daca" stroke-width="1.2"/>
      <text x="38" y="44" font-family="'Source Code Pro', monospace" font-size="16" font-weight="bold" fill="#73daca" text-anchor="middle">02</text>
      <text x="70" y="36" font-family="-apple-system, 'Noto Sans TC', sans-serif" font-size="15" font-weight="bold" fill="#c0caf5">16 扇區色彩矩陣</text>
      <text x="70" y="54" font-family="'Source Code Pro', monospace" font-size="11.5" fill="#565f89">cc1 &amp; block13</text>
      <line x1="18" y1="72" x2="230" y2="72" stroke="#292e42" stroke-width="1"/>
      <text x="18" y="102" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#9ece6a">• Linear WB Gain (cc1)</text>
      <text x="18" y="132" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#9ece6a">• 16 Hue Radial Sectors</text>
      <text x="18" y="162" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#9ece6a">• 3x3 Differential Mat</text>
      <text x="18" y="192" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#9ece6a">• Local Hue Twisting</text>
      <text x="18" y="222" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#9ece6a">• Hardware Register Map</text>
      <text x="18" y="252" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#9ece6a">• Skin Tone Preservation</text>
      <rect x="18" y="352" width="212" height="26" rx="6" fill="#24283b"/>
      <text x="124" y="369" font-family="'Source Code Pro', monospace" font-size="11" fill="#73daca" text-anchor="middle">STAGE: CHROMATIC MATRIX</text>
    </g>

    <!-- Stage 3: 129-Point Spline Tone Curve -->
    <g transform="translate(540, 0)">
      <rect width="248" height="395" rx="16" fill="#1f2335" stroke="#414868" stroke-width="1.4"/>
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#24283b" stroke="#e0af68" stroke-width="1.2"/>
      <text x="38" y="44" font-family="'Source Code Pro', monospace" font-size="16" font-weight="bold" fill="#e0af68" text-anchor="middle">03</text>
      <text x="70" y="36" font-family="-apple-system, 'Noto Sans TC', sans-serif" font-size="15" font-weight="bold" fill="#c0caf5">129 點分段樣條曲線</text>
      <text x="70" y="54" font-family="'Source Code Pro', monospace" font-size="11.5" fill="#565f89">gamma[129] Spline</text>
      <line x1="18" y1="72" x2="230" y2="72" stroke="#292e42" stroke-width="1"/>
      <text x="18" y="102" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#ff9e64">• Soft Highlight Rolloff</text>
      <text x="18" y="132" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#ff9e64">• Midtone Contrast Slope</text>
      <text x="18" y="162" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#ff9e64">• Shadow Lift / Matte Fade</text>
      <text x="18" y="192" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#ff9e64">• Isotonic Monotonicity</text>
      <text x="18" y="222" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#ff9e64">• 129 Spline Nodes</text>
      <text x="18" y="252" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#ff9e64">• Film Dynamic Range</text>
      <rect x="18" y="352" width="212" height="26" rx="6" fill="#24283b"/>
      <text x="124" y="369" font-family="'Source Code Pro', monospace" font-size="11" fill="#e0af68" text-anchor="middle">STAGE: TONE MAPPING</text>
    </g>

    <!-- Stage 4: 5x9x9 3D Polar HSV Lattice -->
    <g transform="translate(810, 0)">
      <rect width="258" height="395" rx="16" fill="#1f2335" stroke="#bb9af7" stroke-width="1.6"/>
      <rect x="18" y="18" width="40" height="40" rx="10" fill="#24283b" stroke="#bb9af7" stroke-width="1.2"/>
      <text x="38" y="44" font-family="'Source Code Pro', monospace" font-size="16" font-weight="bold" fill="#bb9af7" text-anchor="middle">04</text>
      <text x="70" y="36" font-family="-apple-system, 'Noto Sans TC', sans-serif" font-size="15" font-weight="bold" fill="#c0caf5">5×9×9 3D HSV 網格</text>
      <text x="70" y="54" font-family="'Source Code Pro', monospace" font-size="11.5" fill="#565f89">grid[3][405] Trilinear</text>
      <line x1="18" y1="72" x2="240" y2="72" stroke="#292e42" stroke-width="1"/>
      <text x="18" y="102" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#bb9af7">• 5 Luma x 9 Sat x 9 Hue</text>
      <text x="18" y="132" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#bb9af7">• Signed 7-bit (ΔH,ΔS,ΔV)</text>
      <text x="18" y="162" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#bb9af7">• Trilinear Interpolation</text>
      <text x="18" y="192" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#bb9af7">• Bounded Creative Look</text>
      <text x="18" y="222" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#bb9af7">• 405 Lattice Control</text>
      <text x="18" y="252" font-family="'Source Code Pro', monospace" font-size="12.5" fill="#bb9af7">• Hardware Direct LUT</text>
      <rect x="18" y="352" width="222" height="26" rx="6" fill="#24283b"/>
      <text x="129" y="369" font-family="'Source Code Pro', monospace" font-size="11" fill="#bb9af7" text-anchor="middle">STAGE: 3D POLAR LATTICE</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(65, 525)">
    <rect width="1070" height="105" rx="14" fill="#1a1b26" stroke="#292e42" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="6" fill="#f7768e"/>
    <circle cx="48" cy="26" r="6" fill="#e0af68"/>
    <circle cx="68" cy="26" r="6" fill="#9ece6a"/>
    <text x="96" y="31" font-family="'Source Code Pro', monospace" font-size="12" fill="#565f89">sony_bionz_xr_isp_simulation_pipeline.py · target=jxl_16bit_linear · looks=[ST, FL, FL2, FL3, CLASSIC_NEG]</text>

    <!-- Terminal code line -->
    <text x="24" y="64" font-family="'Source Code Pro', monospace" font-size="13" fill="#7dcfff">
      rgb_linear = jxl.decode_linear_f32("input.jxl") ➔ cc1_wb() ➔ block13_matrix() ➔ spline_gamma129()
    </text>
    <text x="24" y="88" font-family="'Source Code Pro', monospace" font-size="13" fill="#73daca">
      ➔ grid405_trilinear() ➔ apply_creative_look(FL2) ➔ jxl.encode_lossless("output_fl2.jxl")
    </text>
  </g>
</svg>
