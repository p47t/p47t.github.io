<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e1e2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0f19;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00599c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#659ad2;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dea584;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="vsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.9" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Header / Title -->
  <text x="600" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    ASYNC ARCHITECTURE &amp; DESIGN PHILOSOPHY
  </text>
  <text x="600" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle">
    C++20/23 Coroutines (Push-Driven) vs. Rust Async/Future (Pull-Driven)
  </text>

  <!-- Left Card: C++ Coroutines -->
  <g transform="translate(80, 150)" filter="url(#cardShadow)">
    <rect width="450" height="440" rx="16" fill="#182234" stroke="url(#cppGrad)" stroke-width="2.5" />
    
    <!-- Title Pill -->
    <rect x="25" y="25" width="180" height="40" rx="8" fill="#00599c" />
    <text x="115" y="50" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">C++20 / C++23</text>
    
    <text x="220" y="52" font-family="sans-serif" font-size="16" font-weight="600" fill="#659ad2">Push-Driven</text>

    <!-- Content Blocks -->
    <g transform="translate(25, 90)">
      <!-- Item 1 -->
      <rect width="400" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">執行模型 (Execution Model)</text>
      <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#cbd5e1">co_await · Symmetric Transfer · Resumption</text>

      <!-- Item 2 -->
      <g transform="translate(0, 70)">
        <rect width="400" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">記憶體佈局 (Memory Layout)</text>
        <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#cbd5e1">Coroutine Frame (Heap) · HALO 最佳化</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 140)">
        <rect width="400" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">取消語義與位址 (Cancellation &amp; Address)</text>
        <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#cbd5e1">std::stop_token 協同取消 · 固定 Frame 位址</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 210)">
        <rect width="400" height="58" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">I/O 適應性 (I/O Matching)</text>
        <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#cbd5e1">天然契合 Completion 模型 (io_uring / IOCP)</text>
      </g>
    </g>
  </g>

  <!-- VS Badge -->
  <g transform="translate(600, 370)">
    <circle cx="0" cy="0" r="38" fill="url(#vsGrad)" filter="url(#cardShadow)"/>
    <text x="0" y="11" font-family="sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">VS</text>
  </g>

  <!-- Right Card: Rust Async -->
  <g transform="translate(670, 150)" filter="url(#cardShadow)">
    <rect width="450" height="440" rx="16" fill="#241a1a" stroke="url(#rustGrad)" stroke-width="2.5" />
    
    <!-- Title Pill -->
    <rect x="25" y="25" width="180" height="40" rx="8" fill="#f74c00" />
    <text x="115" y="50" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Rust Async</text>
    
    <text x="220" y="52" font-family="sans-serif" font-size="16" font-weight="600" fill="#dea584">Pull-Driven</text>

    <!-- Content Blocks -->
    <g transform="translate(25, 90)">
      <!-- Item 1 -->
      <rect width="400" height="58" rx="8" fill="#181212" stroke="#442a2a" stroke-width="1"/>
      <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fb923c">執行模型 (Execution Model)</text>
      <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#fed7aa">Future::poll · Context · Waker · Reactor</text>

      <!-- Item 2 -->
      <g transform="translate(0, 70)">
        <rect width="400" height="58" rx="8" fill="#181212" stroke="#442a2a" stroke-width="1"/>
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fb923c">記憶體佈局 (Memory Layout)</text>
        <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#fed7aa">零 Heap 匿名 State Machine · Enum 膨脹</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 140)">
        <rect width="400" height="58" rx="8" fill="#181212" stroke="#442a2a" stroke-width="1"/>
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fb923c">取消語義與位址 (Cancellation &amp; Address)</text>
        <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#fed7aa">Drop-to-Cancel · Pin&lt;&amp;mut Self&gt; 記憶體釘住</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 210)">
        <rect width="400" height="58" rx="8" fill="#181212" stroke="#442a2a" stroke-width="1"/>
        <text x="15" y="24" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fb923c">I/O 適應性 (I/O Matching)</text>
        <text x="15" y="44" font-family="sans-serif" font-size="12" fill="#fed7aa">天然契合 Readiness 模型 (epoll / Reactor)</text>
      </g>
    </g>
  </g>

  <!-- Footer caption -->
  <text x="600" y="635" font-family="monospace" font-size="13" fill="#64748b" text-anchor="middle">
    simplypatrick.com · Systems Programming Deep Dive
  </text>
</svg>
