<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">寫給攝影愛好者的 JPEG XL 當前生態與 Rust 實作</title>
  <desc id="desc">對決 Ultra HDR、AVIF、HEIF 與 WebP，並解析 jxl-rs 純 Rust 解碼器與 TileSplit 實戰經驗</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="50%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>

    <!-- Top Accent Bar Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="40%" stop-color="#bb9af7"/>
      <stop offset="80%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="jxlCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a34"/>
      <stop offset="100%" stop-color="#162e29"/>
    </linearGradient>

    <linearGradient id="rustCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38241d"/>
      <stop offset="100%" stop-color="#2a1a15"/>
    </linearGradient>

    <linearGradient id="subCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#1a1c2a"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGradient)"/>

  <!-- Subtle Decorative Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Accent bar top-left -->
  <rect x="60" y="45" width="160" height="4" rx="2" fill="url(#accentGradient)"/>

  <!-- Title & Subtitle Section -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">
    <!-- Super Header Badge -->
    <rect x="60" y="60" width="150" height="28" rx="14" fill="rgba(125, 207, 255, 0.12)" stroke="#7dcfff" stroke-width="1.2"/>
    <text x="135" y="79" font-size="14" fill="#7dcfff" font-weight="600" text-anchor="middle" letter-spacing="1">PHOTOGRAPHY &amp; RUST</text>

    <!-- Main Title -->
    <text x="60" y="126" font-size="36" fill="#ffffff" font-weight="700" letter-spacing="0.5">寫給攝影愛好者的 JPEG XL 當前生態與 Rust 實作</text>

    <!-- Bilingual Subtitle -->
    <text x="60" y="162" font-size="19" fill="#a9b1d6" font-weight="400" letter-spacing="0.2">對決 Ultra HDR、AVIF、HEIF 與 WebP · Memory-Safe Rust Decoders (jxl-rs &amp; TileSplit)</text>
  </g>

  <!-- Central Visual Area: Codec Cards & Memory-Safe Pipeline -->
  <g transform="translate(60, 195)">

    <!-- LEFT: JPEG XL Hero Card -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="360" height="345" rx="14" fill="url(#jxlCardBg)" stroke="#10b981" stroke-width="2.5"/>
      
      <!-- Card Header -->
      <rect x="20" y="20" width="98" height="30" rx="6" fill="#10b981"/>
      <text x="69" y="40" font-family="monospace" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">JPEG XL</text>
      
      <text x="132" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#34d399" font-weight="600">攝影專屬次世代規格</text>

      <!-- Key Features List -->
      <g transform="translate(22, 74)" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif">
        <!-- Feature 1 -->
        <circle cx="6" cy="10" r="4.5" fill="#10b981"/>
        <text x="20" y="15" font-size="16" fill="#f0fdf4" font-weight="600">無損轉碼 (Lossless Transcoding)</text>
        <text x="20" y="36" font-size="14" fill="#a7f3d0">既有 JPEG 直接瘦身 20%，100% 位元精確還原</text>

        <!-- Feature 2 -->
        <circle cx="6" cy="64" r="4.5" fill="#10b981"/>
        <text x="20" y="69" font-size="16" fill="#f0fdf4" font-weight="600">原生單層 32-bit 浮點 &amp; HDR</text>
        <text x="20" y="90" font-size="14" fill="#a7f3d0">Rec.2100 / Display P3 真實高光，無雙層偏移坑</text>

        <!-- Feature 3 -->
        <circle cx="6" cy="118" r="4.5" fill="#10b981"/>
        <text x="20" y="123" font-size="16" fill="#f0fdf4" font-weight="600">VarDCT 攝影自然顆粒保真</text>
        <text x="20" y="144" font-size="14" fill="#a7f3d0">無去區塊抹平感，保留底片顆粒與高頻紋理</text>

        <!-- Feature 4 -->
        <circle cx="6" cy="172" r="4.5" fill="#10b981"/>
        <text x="20" y="177" font-size="16" fill="#f0fdf4" font-weight="600">免專利費 · 多核心 SIMD 加速</text>
        <text x="20" y="198" font-size="14" fill="#a7f3d0">Safari / Chrome 155 / Firefox 158 全數到位</text>
      </g>

      <!-- Bottom Tag -->
      <rect x="20" y="295" width="320" height="30" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
      <text x="180" y="315" font-family="monospace" font-size="14" fill="#6ee7b7" text-anchor="middle">2026: Safari + Chrome + Firefox Native</text>
    </g>

    <!-- CENTER: Comparative Competitor Cards (Ultra HDR, AVIF, HEIF/WebP) -->
    <g transform="translate(385, 0)">
      <!-- Ultra HDR -->
      <g filter="url(#shadow)">
        <rect x="0" y="0" width="320" height="105" rx="10" fill="url(#subCardBg)" stroke="#e0af68" stroke-width="1.5"/>
        <rect x="16" y="15" width="92" height="26" rx="4" fill="rgba(224, 175, 104, 0.2)" stroke="#e0af68" stroke-width="1"/>
        <text x="62" y="33" font-family="monospace" font-size="13.5" font-weight="700" fill="#e0af68" text-anchor="middle">Ultra HDR</text>
        <text x="120" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#c0caf5" font-weight="600">向後相容的雙層橋樑</text>
        <text x="16" y="61" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#a9b1d6">8-bit SDR JPEG + MPF Gain Map 增益圖</text>
        <text x="16" y="83" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#a9b1d6">裁切易遺失 HDR（促成 TileSplit 誕生）</text>
      </g>

      <!-- AVIF -->
      <g transform="translate(0, 120)" filter="url(#shadow)">
        <rect x="0" y="0" width="320" height="105" rx="10" fill="url(#subCardBg)" stroke="#38415c" stroke-width="1.5"/>
        <rect x="16" y="15" width="64" height="26" rx="4" fill="rgba(125, 207, 255, 0.2)" stroke="#7dcfff" stroke-width="1"/>
        <text x="48" y="33" font-family="monospace" font-size="14" font-weight="700" fill="#7dcfff" text-anchor="middle">AVIF</text>
        <text x="92" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#c0caf5" font-weight="600">視訊衍生 · 靜態紋理需細調</text>
        <text x="16" y="61" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#a9b1d6">極低位元率壓縮強，但高頻紋理易被平滑</text>
        <text x="16" y="83" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#a9b1d6">高畫質批次編碼耗時，無 JPEG 無損重壓</text>
      </g>

      <!-- HEIC & WebP -->
      <g transform="translate(0, 240)" filter="url(#shadow)">
        <rect x="0" y="0" width="320" height="105" rx="10" fill="url(#subCardBg)" stroke="#38415c" stroke-width="1.5"/>
        <rect x="16" y="15" width="114" height="26" rx="4" fill="rgba(187, 154, 247, 0.2)" stroke="#bb9af7" stroke-width="1"/>
        <text x="73" y="33" font-family="monospace" font-size="13.5" font-weight="700" fill="#bb9af7" text-anchor="middle">HEIC / WebP</text>
        <text x="142" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" fill="#c0caf5" font-weight="600">授權複雜 vs 規格老舊</text>
        <text x="16" y="61" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#a9b1d6">HEIC：機身 10-bit 直出，受制授權爭議</text>
        <text x="16" y="83" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" fill="#a9b1d6">WebP：主要為 8-bit 有失真，缺乏原生 HDR</text>
      </g>
    </g>

    <!-- RIGHT: Rust Memory-Safe Image Pipeline -->
    <g transform="translate(730, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="350" height="345" rx="14" fill="url(#rustCardBg)" stroke="#f97316" stroke-width="2"/>
      
      <!-- Card Header -->
      <rect x="20" y="20" width="74" height="30" rx="6" fill="#f97316"/>
      <text x="57" y="40" font-family="monospace" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">RUST</text>
      <text x="108" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" fill="#fb923c" font-weight="600">瀏覽器與攝影工具核心</text>

      <!-- Rust Pipeline Details -->
      <g transform="translate(20, 74)" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif">
        <!-- Bullet 1 -->
        <rect x="0" y="0" width="310" height="60" rx="6" fill="rgba(249, 115, 22, 0.1)"/>
        <text x="14" y="23" font-size="15" fill="#fed7aa" font-weight="600">jxl-rs：促成 Chrome / Firefox 回歸</text>
        <text x="14" y="45" font-size="13.5" fill="#fdba74">Google Research 純 Rust 解碼，大幅降低資安風險</text>

        <!-- Bullet 2 -->
        <rect x="0" y="72" width="310" height="62" rx="6" fill="rgba(249, 115, 22, 0.1)"/>
        <text x="14" y="95" font-size="15" fill="#fed7aa" font-weight="600">TileSplit：保留 Ultra HDR 切圖實戰</text>
        <text x="14" y="118" font-size="13.5" fill="#fdba74">重組 MPF / XMP，純 Rust 無痛編譯 WASM</text>

        <!-- Bullet 3 -->
        <rect x="0" y="146" width="310" height="62" rx="6" fill="rgba(249, 115, 22, 0.1)"/>
        <text x="14" y="169" font-size="15" fill="#fed7aa" font-weight="600">純 Rust 社群影像生態系</text>
        <text x="14" y="192" font-family="monospace" font-size="13.5" fill="#fdba74">jxl-oxide · zune-image · image-rs</text>
      </g>

      <!-- Bottom Tag -->
      <rect x="20" y="295" width="310" height="30" rx="6" fill="rgba(249, 115, 22, 0.15)"/>
      <text x="175" y="315" font-family="monospace" font-size="14" fill="#fdba74" text-anchor="middle">jxl-rs + TileSplit: Safe &amp; Fast</text>
    </g>

  </g>

  <!-- Bottom Tech Tags -->
  <g transform="translate(60, 615)" font-family="monospace" font-size="14">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="88" height="30" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="44" y="20" fill="#10b981" text-anchor="middle">JPEG XL</text>

    <!-- Tag 2 -->
    <rect x="100" y="0" width="64" height="30" rx="6" fill="rgba(249, 115, 22, 0.15)" stroke="#f97316" stroke-width="1"/>
    <text x="132" y="20" fill="#f97316" text-anchor="middle">Rust</text>

    <!-- Tag 3 -->
    <rect x="176" y="0" width="74" height="30" rx="6" fill="rgba(249, 115, 22, 0.15)" stroke="#fb923c" stroke-width="1"/>
    <text x="213" y="20" fill="#fb923c" text-anchor="middle">jxl-rs</text>

    <!-- Tag 4 -->
    <rect x="262" y="0" width="98" height="30" rx="6" fill="rgba(224, 175, 104, 0.15)" stroke="#e0af68" stroke-width="1"/>
    <text x="311" y="20" fill="#e0af68" text-anchor="middle">Ultra HDR</text>

    <!-- Tag 5 -->
    <rect x="372" y="0" width="98" height="30" rx="6" fill="rgba(224, 175, 104, 0.15)" stroke="#e0af68" stroke-width="1"/>
    <text x="421" y="20" fill="#e0af68" text-anchor="middle">TileSplit</text>

    <!-- Tag 6 -->
    <rect x="482" y="0" width="64" height="30" rx="6" fill="rgba(125, 207, 255, 0.15)" stroke="#7dcfff" stroke-width="1"/>
    <text x="514" y="20" fill="#7dcfff" text-anchor="middle">AVIF</text>

    <!-- Tag 7 -->
    <rect x="558" y="0" width="64" height="30" rx="6" fill="rgba(187, 154, 247, 0.15)" stroke="#bb9af7" stroke-width="1"/>
    <text x="590" y="20" fill="#bb9af7" text-anchor="middle">HEIF</text>
  </g>

  <!-- Bottom Right Subtle Branding -->
  <text x="1140" y="635" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16" fill="rgba(255, 255, 255, 0.45)" text-anchor="end">
    blog.simplypatrick.com
  </text>
</svg>
