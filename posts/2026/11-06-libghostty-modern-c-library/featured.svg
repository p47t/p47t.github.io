<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="libghostty 1.0 architecture banner">
  <title>libghostty 1.0 Architecture Banner</title>
  <desc>Modern C Library Design, C ABI Contract, Opaque Handles, and Custom Allocators</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2230"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.02)"/>
    </linearGradient>

    <!-- Indigo Glow -->
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(129, 140, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(129, 140, 248, 0.02)"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="180" r="280" fill="rgba(56, 189, 248, 0.06)" filter="blur(60px)"/>
  <circle cx="1020" cy="480" r="320" fill="rgba(129, 140, 248, 0.06)" filter="blur(80px)"/>

  <!-- Top Badges & Architecture Header (No repeated title/subtitle) -->
  <g transform="translate(60, 48)">
    <g transform="translate(0, 0)">
      <rect width="145" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="72" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">C ARCHITECTURE</text>
    </g>
    <g transform="translate(160, 0)">
      <rect width="150" height="28" rx="14" fill="rgba(129, 140, 248, 0.15)" stroke="#818cf8" stroke-width="1.2"/>
      <text x="75" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="1">C ABI CONTRACT</text>
    </g>
    <g transform="translate(325, 0)">
      <rect width="155" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.2"/>
      <text x="77" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">OPAQUE HANDLES</text>
    </g>
    <g transform="translate(495, 0)">
      <rect width="165" height="28" rx="14" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="82" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="1">CUSTOM ALLOCATOR</text>
    </g>
    <text x="1080" y="20" font-family="'Source Code Pro', Consolas, monospace" font-size="13" fill="#64748b" text-anchor="end">LIBRARY DESIGN &amp; ABI SPECIFICATION</text>
  </g>

  <!-- Left Window: C API Architecture Spec -->
  <g transform="translate(60, 108)">
    <rect width="525" height="470" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 511 0 Q 525 0 525 14 L 525 38 L 0 38 Z" fill="#1e293b"/>
    <circle cx="24" cy="20" r="5" fill="#f43f5e"/>
    <circle cx="40" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="20" r="5" fill="#10b981"/>
    <text x="262" y="25" font-family="'Source Code Pro', Consolas, monospace" font-size="12.5" font-weight="600" fill="#94a3b8" text-anchor="middle">ghostty/vt.h — C ABI Contract</text>

    <!-- Code Block -->
    <g transform="translate(24, 62)" font-family="'Source Code Pro', Consolas, monospace" font-size="12" line-height="1.5">
      <!-- Line 1: Opaque Handle -->
      <text x="0" y="8" fill="#64748b">// 1. 嚴格的不透明控制代碼（Opaque Handle）</text>
      <text x="0" y="32" fill="#818cf8">typedef struct <tspan fill="#38bdf8">GhosttyTerminalImpl</tspan> *<tspan fill="#f8fafc" font-weight="bold">GhosttyTerminal</tspan>;</text>

      <!-- Line 2: Enum Getters/Setters -->
      <text x="0" y="70" fill="#64748b">// 2. 列舉驅動存取（新增屬性不擴展符號表）</text>
      <text x="0" y="94" fill="#818cf8">GhosttyResult <tspan fill="#38bdf8">ghostty_terminal_get</tspan>(</text>
      <text x="20" y="116" fill="#f8fafc">GhosttyTerminal terminal, GhosttyTerminalData key, void *out);</text>

      <!-- Line 3: Custom Allocator Injection -->
      <text x="0" y="154" fill="#64748b">// 3. 兩層式配置器（{ ctx, vtable } 完整受控）</text>
      <text x="0" y="178" fill="#818cf8">GhosttyResult <tspan fill="#38bdf8">ghostty_terminal_new</tspan>(</text>
      <text x="20" y="200" fill="#f8fafc">const <tspan fill="#38bdf8">GhosttyAllocator</tspan> *allocator, GhosttyTerminal *out,</text>
      <text x="20" y="222" fill="#f8fafc">uint16_t cols, uint16_t rows);</text>

      <!-- Line 4: Explicit Free -->
      <text x="0" y="258" fill="#818cf8">void <tspan fill="#38bdf8">ghostty_terminal_free</tspan>(GhosttyTerminal terminal);</text>

      <!-- Callout Badge -->
      <g transform="translate(0, 290)">
        <rect width="477" height="88" rx="8" fill="url(#cyanGlow)" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="16" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">現代 C 介面準則：完全隔絕實作細節</text>
        <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">不暴露 struct 佈局、列舉底層寬度固定</text>
        <text x="16" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">未知鍵回傳 GHOSTTY_UNSUPPORTED，保障跨版本二進位相容性</text>
      </g>
    </g>
  </g>

  <!-- Right Window: Ecosystem & Production Impact -->
  <g transform="translate(615, 108)">
    <rect width="525" height="470" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Titlebar -->
    <path d="M 0 14 Q 0 0 14 0 L 511 0 Q 525 0 525 14 L 525 38 L 0 38 Z" fill="#1e293b"/>
    <text x="24" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">生態系規模與生產環境實戰驗證</text>
    <text x="501" y="25" font-family="'Source Code Pro', Consolas, monospace" font-size="12" fill="#818cf8" text-anchor="end">libghostty-vt.so.1</text>

    <!-- Production Metrics & Cards -->
    <g transform="translate(24, 60)">
      <!-- Item 1: JetBrains -->
      <g transform="translate(0, 0)">
        <rect width="477" height="96" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="32" cy="48" r="16" fill="rgba(129, 140, 248, 0.2)"/>
        <text x="32" y="54" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#818cf8" text-anchor="middle">JB</text>
        <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">JetBrains 全系列 IDE 內建終端機</text>
        <text x="64" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">替換 JediTerm；產品線涵蓋逾 <tspan fill="#38bdf8" font-weight="bold">1,250 萬</tspan>位活躍開發者</text>
        <text x="64" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">IntelliJ IDEA, PyCharm, GoLand, CLion, Rider 全面採用</text>
      </g>

      <!-- Item 2: Neovim & Modern Tools -->
      <g transform="translate(0, 114)">
        <rect width="477" height="96" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="32" cy="48" r="16" fill="rgba(16, 185, 129, 0.2)"/>
        <text x="32" y="54" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">NV</text>
        <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">Neovim 核心與 agentic coding 工具</text>
        <text x="64" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Neovim 替換 PR 已獲批准待整合；支援 herdr 與 Turborepo</text>
        <text x="64" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">完整解決終端視窗縮放重排版（reflow）長期痛點</text>
      </g>

      <!-- Item 3: Universal FFI lingua franca -->
      <g transform="translate(0, 228)">
        <rect width="477" height="96" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <circle cx="32" cy="48" r="16" fill="rgba(251, 191, 36, 0.2)"/>
        <text x="32" y="54" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="middle">FFI</text>
        <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">跨語言通用中介：10+ 種語言綁定</text>
        <text x="64" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Rust, Go, Python, Swift, .NET, JS, WASM 與嵌入式設備直接呼叫</text>
        <text x="64" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#64748b">以 Zig 高效開發，以純 C ABI 零成本交付全世界</text>
      </g>
    </g>
  </g>

  <!-- Footer Tags & Site Info -->
  <g transform="translate(60, 615)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="85" height="28" rx="6" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1"/>
    <text x="42" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">c</text>

    <!-- Tag 2 -->
    <rect x="95" y="0" width="85" height="28" rx="6" fill="rgba(129, 140, 248, 0.1)" stroke="#818cf8" stroke-width="1"/>
    <text x="137" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#818cf8" text-anchor="middle">zig</text>

    <!-- Tag 3 -->
    <rect x="190" y="0" width="125" height="28" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1"/>
    <text x="252" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#10b981" text-anchor="middle">architecture</text>

    <!-- Tag 4 -->
    <rect x="325" y="0" width="105" height="28" rx="6" fill="rgba(244, 63, 94, 0.1)" stroke="#f43f5e" stroke-width="1"/>
    <text x="377" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#f43f5e" text-anchor="middle">ghostty</text>

    <!-- Tag 5 -->
    <rect x="440" y="0" width="125" height="28" rx="6" fill="rgba(251, 191, 36, 0.1)" stroke="#fbbf24" stroke-width="1"/>
    <text x="502" y="18" font-family="'Source Code Pro', monospace" font-size="12" fill="#fbbf24" text-anchor="middle">ai-assisted</text>

    <!-- Domain Branding -->
    <text x="1080" y="19" font-family="'Source Code Pro', Consolas, monospace" font-size="14" fill="#64748b" text-anchor="end">blog.simplypatrick.com</text>
  </g>
</svg>
