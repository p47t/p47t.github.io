<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#070a12;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="composeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ddc84;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="200" cy="200" r="220" fill="#3ddc84" opacity="0.10" filter="url(#glow)"/>
  <circle cx="600" cy="500" r="250" fill="#6366f1" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1000" cy="220" r="220" fill="#a855f7" opacity="0.10" filter="url(#glow)"/>

  <!-- Header Banner Title -->
  <g transform="translate(600, 70)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="1">Jetpack Compose Rendering Architecture</text>
    <text y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#3ddc84">From ComposeView to RenderNode: 60/120 FPS Hardware Accelerated Animations</text>
  </g>

  <!-- Card 1: View Tree & Interception -->
  <g transform="translate(70, 150)" filter="url(#dropShadow)">
    <rect width="320" height="440" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Title Badge -->
    <rect x="20" y="20" width="280" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="160" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">1. View Tree Interception</text>

    <!-- Node 1: ComposeView -->
    <rect x="35" y="75" width="250" height="48" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="96" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">ComposeView</text>
    <text x="160" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">ViewGroup (Public API Host)</text>

    <!-- Arrow Down -->
    <line x1="160" y1="123" x2="160" y2="145" stroke="#3ddc84" stroke-width="2"/>
    <polygon points="160,150 155,142 165,142" fill="#3ddc84"/>

    <!-- Node 2: AndroidComposeView -->
    <rect x="35" y="152" width="250" height="54" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="160" y="174" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#818cf8" text-anchor="middle">AndroidComposeView</text>
    <text x="160" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a5b4fc" text-anchor="middle">Internal Bridge &amp; LayoutNode Owner</text>

    <!-- Branch Arrows -->
    <path d="M 160 206 L 160 220 L 100 220 L 100 234" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <polygon points="100,238 96,230 104,230" fill="#6366f1"/>

    <path d="M 160 206 L 160 220 L 220 220 L 220 234" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <polygon points="220,238 216,230 224,230" fill="#6366f1"/>

    <!-- Leaf 1: LayoutNode Tree -->
    <rect x="30" y="240" width="125" height="42" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="92" y="258" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#3ddc84" text-anchor="middle">LayoutNode Tree</text>
    <text x="92" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">Compose UI Nodes</text>

    <!-- Leaf 2: AndroidViewsHandler -->
    <rect x="165" y="240" width="125" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="227" y="258" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">AndroidViews</text>
    <text x="227" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Native Views Handler</text>

    <!-- Draw Hook Banner -->
    <rect x="25" y="305" width="270" height="115" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="4,4"/>
    <text x="160" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">Draw Interception Phase</text>
    <text x="160" y="348" font-family="Consolas, Monaco, monospace" font-size="11" fill="#ef4444" text-anchor="middle">onDraw() → Empty</text>
    <text x="160" y="368" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">dispatchDraw(Canvas)</text>
    <text x="160" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Precise Z-Order Layering Control</text>
  </g>

  <!-- Card 2: CanvasHolder Zero Allocation -->
  <g transform="translate(440, 150)" filter="url(#dropShadow)">
    <rect width="320" height="440" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Title Badge -->
    <rect x="20" y="20" width="280" height="36" rx="8" fill="#0f172a" stroke="#3ddc84" stroke-width="1"/>
    <text x="160" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#3ddc84" text-anchor="middle">2. Zero-Allocation Adapter</text>

    <!-- System Canvas -->
    <rect x="35" y="75" width="250" height="45" rx="8" fill="#0f172a" stroke="#64748b"/>
    <text x="160" y="102" font-family="Consolas, Monaco, monospace" font-size="12" font-weight="700" fill="#f8fafc" text-anchor="middle">android.graphics.Canvas</text>

    <!-- Arrow Down -->
    <line x1="160" y1="120" x2="160" y2="140" stroke="#3ddc84" stroke-width="2"/>
    <polygon points="160,145 155,137 165,137" fill="#3ddc84"/>

    <!-- CanvasHolder Wrapper Box -->
    <rect x="30" y="147" width="260" height="150" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="170" font-family="Consolas, Monaco, monospace" font-size="13" font-weight="700" fill="#3ddc84" text-anchor="middle">CanvasHolder</text>
    
    <rect x="45" y="185" width="230" height="42" rx="6" fill="#0f172a" stroke="#047857"/>
    <text x="160" y="203" font-family="Consolas, Monaco, monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">AndroidCanvas Wrapper</text>
    <text x="160" y="218" font-family="Consolas, Monaco, monospace" font-size="10" fill="#34d399" text-anchor="middle">internalCanvas = targetCanvas</text>

    <text x="160" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">inline fun drawInto(targetCanvas) { ... }</text>
    <text x="160" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">0 GC Allocations per Frame</text>

    <!-- Arrow Down -->
    <line x1="160" y1="297" x2="160" y2="317" stroke="#3ddc84" stroke-width="2"/>
    <polygon points="160,322 155,314 165,314" fill="#3ddc84"/>

    <!-- Compose Graphics Canvas -->
    <rect x="35" y="324" width="250" height="45" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="160" y="351" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">androidx.compose.ui.graphics.Canvas</text>

    <!-- Summary Footnote -->
    <rect x="25" y="385" width="270" height="36" rx="6" fill="#0f172a"/>
    <text x="160" y="407" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Reuses single wrapper • Eliminates GC Churn</text>
  </g>

  <!-- Card 3: RenderNode & Dual Thread Pipeline -->
  <g transform="translate(810, 150)" filter="url(#dropShadow)">
    <rect width="320" height="440" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>

    <!-- Title Badge -->
    <rect x="20" y="20" width="280" height="36" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
    <text x="160" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle">3. RenderNode &amp; GPU Pipeline</text>

    <!-- UI Thread Box -->
    <rect x="30" y="72" width="260" height="110" rx="8" fill="#1e1b4b" stroke="#6366f1"/>
    <text x="160" y="93" font-family="Consolas, Monaco, monospace" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">Main UI Thread (Kotlin)</text>
    <text x="160" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">• LayoutNode Measure &amp; Layout</text>
    <text x="160" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">• RenderNode Header Mutation (&lt; 1µs)</text>
    <rect x="45" y="137" width="230" height="24" rx="4" fill="#312e81"/>
    <text x="160" y="153" font-family="Consolas, Monaco, monospace" font-size="10" fill="#fbbf24" text-anchor="middle">translationX / scale / rotation / alpha</text>

    <!-- VSYNC Sync Arrow -->
    <g transform="translate(160, 182)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#a855f7" stroke-width="2"/>
      <polygon points="0,28 -5,20 5,20" fill="#a855f7"/>
      <rect x="-60" y="5" width="120" height="16" rx="4" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
      <text x="0" y="16" font-family="Consolas, Monaco, monospace" font-size="9" fill="#c084fc" text-anchor="middle">VSYNC SyncFrameState</text>
    </g>

    <!-- RenderThread & GPU Box -->
    <rect x="30" y="215" width="260" height="135" rx="8" fill="#3b0764" stroke="#a855f7"/>
    <text x="160" y="236" font-family="Consolas, Monaco, monospace" font-size="12" font-weight="700" fill="#f0abfc" text-anchor="middle">RenderThread (C++ / HWUI)</text>
    
    <rect x="45" y="247" width="230" height="32" rx="4" fill="#581c87"/>
    <text x="160" y="262" font-family="Consolas, Monaco, monospace" font-size="10" font-weight="700" fill="#e9d5ff" text-anchor="middle">Display List (Immutable Drawing Ops)</text>
    <text x="160" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#d8b4fe" text-anchor="middle">drawRect, drawPath, drawText</text>

    <text x="160" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f5d0fe" text-anchor="middle">4x4 Matrix Transformation on GPU</text>
    <text x="160" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f5d0fe" text-anchor="middle">Skia Engine → Vulkan / OpenGL ES</text>

    <!-- Final Result Badge -->
    <rect x="30" y="365" width="260" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="160" y="387" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#3ddc84" text-anchor="middle">60 / 120 FPS Smooth Animation</text>
    <text x="160" y="405" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Zero UI Thread Re-layout / Re-record</text>
  </g>
</svg>
