<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b1120;stop-opacity:1" />
    </linearGradient>

    <!-- Radar Grid Gradient -->
    <radialGradient id="radarGlow" cx="440" cy="340" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.12" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:0.04" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0" />
    </radialGradient>

    <!-- Panel Card Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.95" />
    </linearGradient>

    <!-- Thruster Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Coordinate Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
  </g>

  <!-- Left / Center Sector: Tactical Flight Arena -->
  <g transform="translate(430, 335)">
    <!-- Radar Rings -->
    <circle r="330" fill="url(#radarGlow)" />
    <circle r="300" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.4" />
    <circle r="210" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,6" opacity="0.5" />
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,4" opacity="0.4" />

    <!-- Crosshair Axes -->
    <line x1="-330" y1="0" x2="330" y2="0" stroke="#334155" stroke-width="1" opacity="0.3" />
    <line x1="0" y1="-330" x2="0" y2="330" stroke="#334155" stroke-width="1" opacity="0.3" />

    <!-- Velocity Drift Vector (Ship moving East at 240 px/s) -->
    <line x1="0" y1="0" x2="190" y2="0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="195,0 180,-6 180,6" fill="#f59e0b" />
    <text x="110" y="-14" fill="#f59e0b" font-family="'Source Code Pro', monospace" font-size="12" font-weight="bold">v_drift: 240 px/s</text>

    <!-- Counter-Thrust Vector (Ship facing West at 180° to brake) -->
    <line x1="0" y1="0" x2="-140" y2="0" stroke="#38bdf8" stroke-width="2.5" />
    <polygon points="-145,0 -130,-7 -130,7" fill="#38bdf8" />
    <text x="-135" y="-16" fill="#38bdf8" font-family="'Source Code Pro', monospace" font-size="12" font-weight="bold">Counter-Thrust Braking</text>

    <!-- Braking Arc Indicator -->
    <path d="M 40 -40 A 56 56 0 0 1 -40 -40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8" />
    <text x="0" y="-62" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="10" text-anchor="middle">Heading Align Error: 0.12 rad</text>

    <!-- The Ship (Facing West: angle = PI, counter-thrusting against forward drift) -->
    <g transform="rotate(180)">
      <!-- Thruster Plume firing to rear (which points East) -->
      <path d="M -16 -6 L -48 0 L -16 6 Z" fill="url(#flameGrad)" filter="url(#glowOrange)" />
      <!-- Ship Triangle Body -->
      <polygon points="22,0 -16,-14 -8,0 -16,14" fill="#0f172a" stroke="#ffffff" stroke-width="2.5" />
      <polygon points="14,0 -10,-8 -4,0 -10,8" fill="#38bdf8" opacity="0.6" />
      <!-- Cockpit Point -->
      <circle cx="2" cy="0" r="2.5" fill="#38bdf8" />
    </g>

    <!-- Target Asteroid in Rear-Right Sector (r02) -->
    <g transform="translate(180, 160)">
      <!-- Lead Bearing Line from Ship to Target -->
      <line x1="-180" y1="-160" x2="0" y2="0" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.6" />
      <!-- Target Bracket -->
      <path d="M -30 -20 L -30 -30 L -20 -30" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <path d="M 20 -30 L 30 -30 L 30 -20" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <path d="M -30 20 L -30 30 L -20 30" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <path d="M 20 30 L 30 30 L 30 20" fill="none" stroke="#818cf8" stroke-width="1.5" />
      <!-- Asteroid Polygon -->
      <polygon points="0,-26 18,-18 26,-6 22,16 6,26 -16,22 -26,10 -24,-12" fill="#1e293b" stroke="#cbd5e1" stroke-width="2" />
      <text x="36" y="6" fill="#818cf8" font-family="'Source Code Pro', monospace" font-size="11" font-weight="bold">r02 [LEAD AIM]</text>
      <text x="36" y="22" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="9.5">leadBearing: +142°</text>
    </g>

    <!-- Distant Asteroid (r07) -->
    <g transform="translate(-220, -180)">
      <polygon points="0,-20 14,-14 20,-4 16,12 4,20 -12,16 -20,8 -18,-10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
      <text x="-26" y="34" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="9.5" text-anchor="middle">r07 (Safe)</text>
    </g>

    <!-- Small Asteroid Shard (r11) -->
    <g transform="translate(-180, 190)">
      <polygon points="0,-12 9,-8 12,-2 10,8 2,12 -8,10 -12,4 -10,-6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    </g>
  </g>

  <!-- Top Masthead Bar -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="8" height="42" fill="#38bdf8" rx="2" />
    <text x="22" y="22" fill="#f8fafc" font-family="'Arvo', Georgia, serif" font-size="23" font-weight="bold" letter-spacing="0.5">JEV AUTOPILOT // TACTICAL EVOLUTION</text>
    <text x="22" y="39" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="11.5" letter-spacing="1">STATE ENRICHMENT · PROMPT BOUNDARIES · ACTIVE BRAKING</text>
  </g>

  <!-- Speedrun Comparison Badge (Top Right) -->
  <g transform="translate(850, 42)" filter="url(#cardShadow)">
    <rect width="290" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="26" cy="26" r="10" fill="#0284c7" />
    <polygon points="23,21 31,26 23,31" fill="#ffffff" />
    <text x="46" y="23" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="10" font-weight="bold" letter-spacing="0.5">SECTOR 01 CLEAR TIME</text>
    <text x="46" y="41" fill="#38bdf8" font-family="'Source Code Pro', monospace" font-size="16" font-weight="bold">84s → 17s (5x FASTER)</text>
  </g>

  <!-- Right Side Flight Computer Telemetry HUD -->
  <g transform="translate(820, 114)" filter="url(#cardShadow)">
    <!-- Main Card Body -->
    <rect width="320" height="505" rx="12" fill="url(#panelGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header -->
    <path d="M 0 12 Q 0 0 12 0 L 308 0 Q 320 0 320 12 L 320 46 L 0 46 Z" fill="#0f172a" />
    <circle cx="24" cy="23" r="5" fill="#10b981" filter="url(#glowCyan)" />
    <text x="38" y="27" fill="#f8fafc" font-family="'Source Code Pro', monospace" font-size="12" font-weight="bold" letter-spacing="1">JEV FLIGHT COMPUTER</text>
    <text x="296" y="27" fill="#38bdf8" font-family="'Source Code Pro', monospace" font-size="11" text-anchor="end" font-weight="bold">v1.13.0</text>
    <line x1="0" y1="46" x2="320" y2="46" stroke="#1e293b" stroke-width="1" />

    <!-- Maneuver Status Section -->
    <g transform="translate(20, 64)">
      <text x="0" y="0" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="10" font-weight="bold">TACTICAL MANEUVER</text>
      <text x="0" y="26" fill="#38bdf8" font-family="'Arvo', Georgia, serif" font-size="24" font-weight="bold">REPOSITION</text>
      <text x="0" y="44" fill="#94a3b8" font-family="sans-serif" font-size="11.5">Reducing drift, then turning into a stable firing angle.</text>
    </g>

    <!-- Probability Distribution Bars -->
    <g transform="translate(20, 142)">
      <text x="0" y="0" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="10" font-weight="bold">PROBABILITY DISTRIBUTION</text>

      <!-- Reposition Bar (Winner) -->
      <g transform="translate(0, 16)">
        <text x="0" y="11" fill="#38bdf8" font-family="'Source Code Pro', monospace" font-size="11" font-weight="bold">REPOSITION</text>
        <text x="280" y="11" fill="#38bdf8" font-family="'Source Code Pro', monospace" font-size="11" font-weight="bold" text-anchor="end">68%</text>
        <rect x="0" y="18" width="280" height="8" rx="4" fill="#0f172a" />
        <rect x="0" y="18" width="190" height="8" rx="4" fill="#38bdf8" />
      </g>

      <!-- Intercept Bar -->
      <g transform="translate(0, 48)">
        <text x="0" y="11" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="11">INTERCEPT</text>
        <text x="280" y="11" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="11" text-anchor="end">16%</text>
        <rect x="0" y="18" width="280" height="8" rx="4" fill="#0f172a" />
        <rect x="0" y="18" width="45" height="8" rx="4" fill="#64748b" />
      </g>

      <!-- Evade Bar -->
      <g transform="translate(0, 80)">
        <text x="0" y="11" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="11">EVADE</text>
        <text x="280" y="11" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="11" text-anchor="end">16%</text>
        <rect x="0" y="18" width="280" height="8" rx="4" fill="#0f172a" />
        <rect x="0" y="18" width="45" height="8" rx="4" fill="#64748b" />
      </g>
    </g>

    <line x1="20" y1="262" x2="300" y2="262" stroke="#1e293b" stroke-width="1" />

    <!-- Enriched Tactical State Section -->
    <g transform="translate(20, 280)">
      <text x="0" y="0" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="10" font-weight="bold">ENRICHED TACTICAL FEATURES</text>

      <g transform="translate(0, 16)">
        <rect width="88" height="52" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="44" y="18" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="9" text-anchor="middle">IMMINENT</text>
        <text x="44" y="40" fill="#10b981" font-family="'Source Code Pro', monospace" font-size="18" font-weight="bold" text-anchor="middle">0</text>
      </g>

      <g transform="translate(96, 16)">
        <rect width="88" height="52" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="44" y="18" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="9" text-anchor="middle">FIRING OPP</text>
        <text x="44" y="40" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="18" font-weight="bold" text-anchor="middle">0</text>
      </g>

      <g transform="translate(192, 16)">
        <rect width="88" height="52" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="44" y="18" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="9" text-anchor="middle">BEST AIM</text>
        <text x="44" y="40" fill="#f59e0b" font-family="'Source Code Pro', monospace" font-size="18" font-weight="bold" text-anchor="middle">180°</text>
      </g>
    </g>

    <!-- Controller Execution State -->
    <g transform="translate(20, 375)">
      <rect width="280" height="58" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-family="'Source Code Pro', monospace" font-size="10" font-weight="bold">LOCAL CONTROLLER ACTUATION</text>
      <text x="14" y="44" fill="#f8fafc" font-family="'Source Code Pro', monospace" font-size="13" font-weight="bold">BRAKING: TURN &amp; COUNTER-THRUST</text>
    </g>

    <!-- Telemetry Footer Stats -->
    <g transform="translate(20, 462)">
      <text x="0" y="16" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="10.5">Latency: <tspan fill="#f8fafc" font-weight="bold">129 ms</tspan></text>
      <text x="140" y="16" fill="#64748b" font-family="'Source Code Pro', monospace" font-size="10.5">Confidence: <tspan fill="#f8fafc" font-weight="bold">51%</tspan></text>
      <text x="280" y="16" fill="#10b981" font-family="'Source Code Pro', monospace" font-size="10.5" text-anchor="end" font-weight="bold">ACTIVE</text>
    </g>
  </g>

  <!-- Bottom Left Philosophy Tag -->
  <g transform="translate(60, 615)">
    <rect width="360" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
    <text x="14" y="19" fill="#94a3b8" font-family="'Source Code Pro', monospace" font-size="10.5">DUAL-LAYER AUTOPILOT · DOMAIN-ENRICHED STATE</text>
  </g>
</svg>
