<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#020617;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="waylandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gtkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="ipcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Decorative Grid Overlay -->
  <g opacity="0.04" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)" />
  </g>

  <!-- Background Glow Orbs -->
  <circle cx="220" cy="180" r="220" fill="#e11d48" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="520" r="250" fill="#0284c7" opacity="0.10" filter="url(#glow)"/>
  <circle cx="980" cy="200" r="220" fill="#7c3aed" opacity="0.09" filter="url(#glow)"/>

  <!-- Header Banner Title -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" letter-spacing="1">Wayland Architecture &amp; GTK Deep Dive</text>
    <text y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="2">GTK • xdg_shell • wl_surface • SCM_RIGHTS IPC</text>
  </g>

  <!-- Architecture Visual Cards -->
  <!-- Left Card: GTK Client Layer -->
  <g transform="translate(80, 160)" filter="url(#cardShadow)">
    <rect width="300" height="430" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="8" rx="4" fill="url(#gtkGrad)"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#fda4af">GTK 4 / GTK 3 Client</text>
    <text x="24" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">UI Toolkit &amp; CSD</text>

    <!-- Sub boxes inside Client -->
    <g transform="translate(20, 85)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">GTK Widgets &amp; CSD</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">HeaderBar, Buttons, Layout</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">GSK / Cairo / EGL</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">GPU Render &amp; Buffer Creation</text>
    </g>

    <g transform="translate(20, 225)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">GDK Wayland Backend</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">GMainContext &amp; Event Loop</text>
    </g>

    <g transform="translate(20, 295)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">libwayland-client</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Proxy Objects &amp; Marshalling</text>
    </g>

    <g transform="translate(20, 365)">
      <rect width="260" height="42" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">UNIX Socket Client (/run/user/...)</text>
    </g>
  </g>

  <!-- Middle Card: Wayland Protocols & Wire IPC -->
  <g transform="translate(450, 160)" filter="url(#cardShadow)">
    <rect width="300" height="430" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="8" rx="4" fill="url(#ipcGrad)"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#e9d5ff">Protocols &amp; IPC Wire</text>
    <text x="24" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Binary Stream &amp; SCM_RIGHTS</text>

    <!-- Protocol Boxes -->
    <g transform="translate(20, 85)">
      <rect width="260" height="68" rx="8" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">xdg_shell Protocol</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c084fc">xdg_toplevel • xdg_popup</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Atomic Configure / Ack Handshake</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="260" height="68" rx="8" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">wl_surface Primitive</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c084fc">Pending State → commit()</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Damage • Frame Callback • Regions</text>
    </g>

    <g transform="translate(20, 245)">
      <rect width="260" height="78" rx="8" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">8-Byte Header Wire Format</text>
      <text x="16" y="42" font-family="monospace" font-size="11" fill="#38bdf8">[ObjectID:32] [Size:16] [Opcode:16]</text>
      <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">32-bit aligned arguments payload</text>
    </g>

    <g transform="translate(20, 335)">
      <rect width="260" height="72" rx="8" fill="#064e3b" stroke="#10b981" stroke-opacity="0.5" stroke-width="1"/>
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">Zero-Copy DMA-BUF Passing</text>
      <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6ee7b7">sendmsg(..., SCM_RIGHTS, fd)</text>
      <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a7f3d0" opacity="0.8">Direct GPU Texture Sharing</text>
    </g>
  </g>

  <!-- Right Card: Wayland Compositor Layer -->
  <g transform="translate(820, 160)" filter="url(#cardShadow)">
    <rect width="300" height="430" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="8" rx="4" fill="url(#waylandGrad)"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#bae6fd">Wayland Compositor</text>
    <text x="24" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Display Server &amp; Window Manager</text>

    <!-- Sub boxes inside Compositor -->
    <g transform="translate(20, 85)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">Mutter / KWin / Sway</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Display Server &amp; Shell Logic</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">libwayland-server</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Resource Management &amp; Demarshall</text>
    </g>

    <g transform="translate(20, 225)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">OpenGL / Vulkan Compositing</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Multi-surface Scene Composition</text>
    </g>

    <g transform="translate(20, 295)">
      <rect width="260" height="58" rx="8" fill="#0f172a" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">libinput &amp; wl_seat</text>
      <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">Keyboard, Pointer &amp; Touch Dispatch</text>
    </g>

    <g transform="translate(20, 365)">
      <rect width="260" height="42" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">Linux DRM / KMS (Direct Output)</text>
    </g>
  </g>

  <!-- Connecting Arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 380 240 L 450 240" marker-end="url(#arrow)"/>
    <path d="M 450 300 L 380 300"/>
    <path d="M 750 240 L 820 240"/>
    <path d="M 820 300 L 750 300"/>
  </g>
</svg>
